  neonText('TEST FIRE',W/2,H*0.08,20,UI.cyan,'center');
  CX.fillStyle='#cfe9ff';CX.font="bold 14px 'Courier New',monospace";CX.textAlign='center';
  CX.fillText('DPS ≈ '+(TF.total/sec).toFixed(1)+'   ·   '+sec.toFixed(1)+'s',W/2,H*0.08+24);
  CX.fillStyle='#b98bff';CX.font="10px 'Courier New',monospace";const lo=loadoutStr();CX.fillText(lo.length>60?lo.slice(0,59)+'…':lo,W/2,H*0.08+42);
  CX.fillStyle=UI.dim;CX.font="9px 'Courier New',monospace";CX.fillText('ship weapons only · drone & orbs not shown · damage is an estimate',W/2,H*0.92);
  CX.fillStyle='#8fb8d8';CX.font="10px 'Courier New',monospace";CX.fillText('F or X  (pad: X or B)  ·  tap  —  back to the Dock',W/2,H*0.95);
  CX.textAlign='left';
}

/* =====================================================================
   SCORING (chain + graze + rank)
   ===================================================================== */
function addScore(base){G.score+=Math.round(base*G.mult);}
function recalcMult(){G.mult=clamp(1+Math.min(G.chain,60)*0.1,1,7);}
function bumpChain(){G.chain++;if(G.chain>(G.maxChain||0))G.maxChain=G.chain;G.chainTimer=150;recalcMult();}
function breakChain(){if(G.chain>4)floatText(player.x,player.y-30,'CHAIN LOST','#ff6a8a',11);G.chain=0;G.chainTimer=0;recalcMult();}
function addGraze(x,y){
  G.graze++;G.chainTimer=Math.max(G.chainTimer,60);G.rank=clamp(G.rank+0.004,0,D().rankMax);
  addScore(6*(player.grazeMul||1));
  if(G.graze%10===0){floatText(x,y,'GRAZE '+G.graze,'#ffd166',11);ring(x,y,'#ffd166',3,20,14);}
  parts.push({x,y,vx:0,vy:0,life:14,max:14,color:'#ffd166',size:2.4,g:0});
}

/* =====================================================================
   COLLISIONS & WORLD UPDATE
   ===================================================================== */
function updateWorld(dt){
  // player shots
  for(let i=pShots.length-1;i>=0;i--){const s=pShots[i];
    if(s.boomerang){s.boom+=dt;   // SCYTHE: fly out, then curve back to the ship (hits on both passes)
      if(s.boom>s.boomOut){const a=Math.atan2(player.y-s.y,player.x-s.x);s.vx=lerp(s.vx,Math.cos(a)*11,0.14);s.vy=lerp(s.vy,Math.sin(a)*11,0.14);
        if(dist2(s.x,s.y,player.x,player.y)<16*16){pShots.splice(i,1);continue;}}
      s.life-=dt;if(s.life<=0){pShots.splice(i,1);continue;}
      if(G.frame%2===0)parts.push({x:s.x,y:s.y,vx:0,vy:0,life:9,max:9,color:s.color,size:2,g:0});}
    else if(s.homing){let best=null,bd=1e9;const list=boss?[boss]:enemies;
      for(const e of list){const d=dist2(s.x,s.y,e.x,e.y);if(d<bd){bd=d;best=e;}}
      if(best){const a=Math.atan2(best.y-s.y,best.x-s.x);s.vx=lerp(s.vx,Math.cos(a)*8,0.08);s.vy=lerp(s.vy,Math.sin(a)*8,0.08);}
      s.life-=dt;if(s.life<=0){ if(s.explosive)missileExplode(s); else if(s.mirv)mirvBurst(s); pShots.splice(i,1);continue;}
      if(G.frame%2===0)parts.push({x:s.x,y:s.y,vx:0,vy:0,life:12,max:12,color:s.color,size:2,g:0});}
    else if(s.life!==undefined){s.life-=dt;if(s.life<=0){pShots.splice(i,1);continue;}}   // flak/scatter pellets expire
    if(s.zap!==undefined){s.zap-=dt;if(s.zap<=0){s.zap=7;arcChain(s.x,s.y,pDmg(s.dmg)*0.7,s.zapN||2,null,s.color);
      for(let c=0;c<2;c++){const a=rand(TAU);webBolt(s.x,s.y,s.x+Math.cos(a)*rand(10,22),s.y+Math.sin(a)*rand(10,22),s.color||'#5ad1ff',1,1.5);}}}   // TESLA/SHOCK ORB: chain lightning + ambient crackle around the orb
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.pbounce){let bnc=false;   // RICOCHET: reflect off the play-field walls
      if(s.x<s.r){s.x=s.r;s.vx=Math.abs(s.vx);bnc=true;}else if(s.x>W-s.r){s.x=W-s.r;s.vx=-Math.abs(s.vx);bnc=true;}
      if(s.y<s.r){s.y=s.r;s.vy=Math.abs(s.vy);bnc=true;}else if(s.y>H-s.r){s.y=H-s.r;s.vy=-Math.abs(s.vy);bnc=true;}
      if(bnc)spark(s.x,s.y,s.color,0);}
    if(!s.boomerang&&!s.pbounce&&(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30)){pShots.splice(i,1);continue;}
    if(s.bhitCd>0)s.bhitCd-=dt;   // pierce re-hit throttle vs the boss (below)
    if(boss&&!boss.dead&&dist2(s.x,s.y,boss.x,boss.y)<(boss.r+s.r)**2){
      if(s.explosive){missileExplode(s);pShots.splice(i,1);continue;}
      if(s.pierce){   // piercing shots pass THROUGH the boss but can only re-hit it every few frames — kills the "park a laser on the boss" DPS runaway (was a 3.5× TTK swing / laser dominance)
        if(!(s.bhitCd>0)){damageBoss(pDmg(s.dmg));s.bhitCd=3;spark(s.x,s.y,s.color,Math.atan2(-s.vy,-s.vx));}}
      else{damageBoss(pDmg(s.dmg));spark(s.x,s.y,s.color,Math.atan2(-s.vy,-s.vx));if(s.mirv)mirvBurst(s);pShots.splice(i,1);continue;}}
    let removed=false;
    for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];
      if(!e.seen)continue;   // not on-screen yet → shots pass straight through (they're invulnerable; without this, bullets silently vanished into enemies you can't see)
      if(dist2(s.x,s.y,e.x,e.y)<(e.r+s.r)**2){
        if(s.explosive){missileExplode(s);pShots.splice(i,1);removed=true;break;}
        const dead=damageEnemy(e,pDmg(s.dmg));spark(s.x,s.y,s.color,Math.atan2(-s.vy,-s.vx));
        if(dead)killEnemy(e,j);   // kill BEFORE arcChain: arcChain splices `enemies` and would invalidate j (HIGH bug — stale index left the dead enemy alive to re-award score & re-spawn splitter fragments every hit)
        if(s.arc){arcChain(e.x,e.y,pDmg(s.dmg)*0.75,s.arc,e,s.color);s.arc=0;}   // chain lightning (once per shot)
        if(G.frame%2===0)sfx('hit',0.5,rand(1.1,1.4));
        if(!s.pierce){if(s.mirv)mirvBurst(s);pShots.splice(i,1);removed=true;break;}else{s.pierce--;if(s.pierce<=0){pShots.splice(i,1);removed=true;break;}}}}
    if(removed)continue;}
  // enemies
  for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];e.t+=dt;if(e.flash>0)e.flash-=dt;if(e.sflash>0)e.sflash-=dt;
    const Dn=ENEMY_DEFS[e.type];
    if(e.flee){e.seen=true;if(G.orient==='vertical')e.y+=4*dt;else e.x-=4*dt;}   // retreat off-screen (skip normal update, which sets position absolutely) so a lingering enemy can't delay the boss
    else if(Dn)Dn.update(e,dt);
    if(!e.seen&&e.x>-25&&e.x<W+25&&e.y>-25&&e.y<H+25)e.seen=true;   // mark once it enters view…
    // …then only cull on the exit side once seen (staggered off-screen spawns get to arrive); t>3000 is a safety backstop
    if(e.type!=='miniboss'&&((e.seen&&(e.y>H+60||e.x<-70||e.x>W+70||e.y<-140))||e.t>3000)){enemies.splice(j,1);continue;}
    if(player.alive&&player.iframes<=0&&dist2(e.x,e.y,player.x,player.y)<(e.r+player.coreR)**2)player.hit();}
  // enemy bullets + graze + pod block
  if(eShots.length>520)eShots.splice(0,eShots.length-480);   // readability/perf soft cap: drop oldest
  for(let i=eShots.length-1;i>=0;i--){const b=eShots[i];b.t+=dt;
    // per-bullet behaviors: homing steer, sine weave, constant turn (spiral trails), timed mine fuse
    if(b.fuse!==undefined){b.fuse-=dt;if(b.fuse<=0){eRing(b.x,b.y,b.burst||10,2.2,rand(TAU),b.color,3.6);sfx('enemyshot',0.5,0.7);eShots.splice(i,1);continue;}}
    if(b.home){const a=aimAt(b.x,b.y),ca=Math.atan2(b.vy,b.vx),d=clamp(((a-ca+Math.PI*3)%TAU)-Math.PI,-b.home,b.home)*dt;const na=ca+d;b.vx=Math.cos(na)*b.spd;b.vy=Math.sin(na)*b.spd;}
    else if(b.wave){const na=b.ba+Math.sin(b.t*(b.wfreq||0.1))*b.wave;b.vx=Math.cos(na)*b.spd;b.vy=Math.sin(na)*b.spd;}
    else if(b.turn){const na=Math.atan2(b.vy,b.vx)+b.turn*dt;b.vx=Math.cos(na)*b.spd;b.vy=Math.sin(na)*b.spd;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.bounce&&(b.x<b.r||b.x>W-b.r)){b.vx*=-1;b.ba=Math.PI-b.ba;b.x=clamp(b.x,b.r,W-b.r);}
    if(b.x<-24||b.x>W+24||b.y<-24||b.y>H+40){eShots.splice(i,1);continue;}
    if(player.pod&&player.pod.blockR>0&&dist2(b.x,b.y,player.pod.x,player.pod.y)<(player.pod.blockR+b.r)**2){eShots.splice(i,1);spark(b.x,b.y,'#b98bff',0);continue;}
    if(player.alive){const dc=dist2(b.x,b.y,player.x,player.y);
      if(dc<(player.coreR+b.r)**2){player.hit();eShots.splice(i,1);continue;}
      const gr=player.r+b.r;
      if(!b.grazed&&dc<gr*gr&&player.iframes<=0){b.grazed=true;addGraze(b.x,b.y);}}}
  // pickups
  const magR=80+player.magnetLvl*50;   // innate magnet (magnetLvl=1) sets the pickup pull radius
  for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];
    if(G.orient==='vertical')p.y+=1.2*dt;else p.x-=1.2*dt;p.t+=dt;
    const d=Math.hypot(player.x-p.x,player.y-p.y);
    if(d<magR){p.x=lerp(p.x,player.x,0.14);p.y=lerp(p.y,player.y,0.14);}
    if(d<player.r+8){ if(p.kind==='ammo')player.addMissiles(); else player.addPod(); pickups.splice(i,1);continue;}
    if(p.y>H+30||p.x<-30||p.x>W+30||p.y<-30)pickups.splice(i,1);}
  // chain timer decay
  if(G.chainTimer>0){G.chainTimer-=dt;if(G.chainTimer<=0&&G.chain>0)breakChain();}
  // rank drift up with survival, capped
  G.noHitTime+=dt; G.rank=clamp(G.rank+0.00012*dt*(G.noHitTime>240?1:0),0,D().rankMax);
}

function killEnemy(e,idx,noSplit){
  e.dead=true; G.kills=(G.kills||0)+1; bumpChain(); addScore(e.score);
  const big=e.type==='miniboss'||e.maxhp>40;
  player.gainXP(big?4:1); G.scrap+=Math.round(((big?8:1)+player.salvageLvl)*scrapMul());   // kills feed the draft + shop economy
  if(player.relics.vampire&&player.hp<player.maxhp&&rand()<0.15){player.hp++;floatText(player.x,player.y-18,'+HP','#4dff88',10);ring(player.x,player.y,'#4dff88',5,34,16);sfx('powerup',0.4,1.4);}
  if(e.split&&!noSplit){for(let k=0;k<3;k++){const a=(G.orient==='vertical'?Math.PI/2:Math.PI)+(k-1)*0.7;const d=makeEnemy('dart',e.x,e.y);d.vx=Math.cos(a)*3.2;d.vy=Math.sin(a)*3.2;d.seen=true;enemies.push(d);}}   // splitter fragments (suppressed on bomb clear)
  burst(e.x,e.y,e.glow?'#c77dff':'#ff8a5a',big?26:14,big?6:4,big?40:28,3);
  if(big)rayBurst(e.x,e.y,e.glow?'#c77dff':'#ffca3a',7,18,e.r*3.2);   // big ships pop with radiant light
  debris(e.x,e.y,e.glow?'#c77dff':'#8fb8d8',big?10:5);
  ring(e.x,e.y,'#ffb3c1',4,e.r*2.2,20);
  shake(big?0.5:0.12); G.freeze=Math.max(G.freeze,big?5:0);
  sfx(big?'explode_big':'explode',big?1:0.7,rand(0.9,1.1));
  floatText(e.x,e.y,'+'+Math.round(e.score*G.mult),'#cfe9ff',big?12:10);
  if(e.type==='miniboss'){
    spawner.miniOut=false;spawner.waveCd=100;
    player.stealType=STEAL_BY_BG[curStage().bg]||pick(Object.keys(STEAL_WEAPONS));   // the stage theme decides what you steal
    const sw=STEAL_WEAPONS[player.stealType]; player.stealAmmo=sw.ammo;
    G.banner='WEAPON STOLEN: '+sw.name;G.subBanner=sw.ammo+' rounds';G.bannerT=160;
    G.flash=12;G.flashColor=sw.color;shake(0.7);sfx('complete',1,0.9);
    for(let k=0;k<40;k++)burst(e.x,e.y,sw.color,1,7,50,4);ring(e.x,e.y,sw.color,8,110,32,3);
  }
  if(e.glow&&Math.random()<0.65)pickups.push({x:e.x,y:e.y,t:0});
  if((e.type==='carrier'||e.type==='elite')&&Math.random()<0.5)pickups.push({x:e.x,y:e.y,t:0});
  // enemies drop explosive-missile ammo (bigger enemies more often)
  if(Math.random()<(big?0.4:0.08))pickups.push({x:e.x,y:e.y,t:0,kind:'ammo'});
  if(idx!==undefined)enemies.splice(idx,1);else{const k=enemies.indexOf(e);if(k>=0)enemies.splice(k,1);}
}
function damageBoss(d){const b=boss;if(!b||b.dead||b.enter||b.shield>0)return;b.hp-=d;b.hitFlash=3;if(G.frame%2===0)sfx('hit',0.4,rand(0.9,1.2));if(b.hp<=0){b.dead=true;killBoss();}}   // invulnerable while flying in AND during phase-shield windows — no free-melting on entry, and a hard floor on kill speed between phases
function killBoss(){
  const b=boss;addScore(5000);shake(1);G.flash=22;G.flashColor='#fff';G.freeze=14;sfx('explode_big',1,0.7);rumble(1,0.8,600);
  for(let k=0;k<90;k++)burst(b.x+rand(-b.r,b.r),b.y+rand(-b.r,b.r),k%2?'#ff2f8e':'#ffd27f',2,6,rand(30,70),4);
  rayBurst(b.x,b.y,'#ffffff',18,42,240); rayBurst(b.x,b.y,b.col||'#ff9d3d',14,34,180);   // radiant boss-death light
  for(let i=0;i<16;i++){const a=i/16*TAU+rand(-0.08,0.08);lightShaft(b.x,b.y,a,rand(140,300),rand(12,30),i%2?'#ffffff':(b.col||'#ff9d3d'),rand(28,46));}   // volumetric god-rays fan out from the death
  debris(b.x,b.y,'#8fb8d8',24);ring(b.x,b.y,'#fff',10,220,40,4);
  eShots.length=0;beams.length=0;enemies.length=0;boss=null;   // clear summoned minions so they don't leak into the next stage
  if((G.bossQueue||0)>0){ G.bossQueue--; G.flash=Math.max(G.flash,12); shake(0.5); sfx('complete',1,0.8); spawnBoss((b._seq||0)+1); return; }   // GAUNTLET: the next boss flies in — the stage isn't clear until the last one falls
  if(G.runMode==='bossrush'){const bonus=120+G.stage*25;G.scrap+=bonus;player.pendingLevels++;floatText(W/2,H*0.42,'+'+bonus+' SCRAP · LEVEL UP','#ffd166',14);}   // BOSS RUSH has no waves to farm — every kill pays out so the build keeps pace
  if(G.stage>=G.maxStage){
    if(G.loop>=G.maxLoop){endGame(true);}   // true ending
    else{startLoop();}                        // beat all stages → loop harder
  } else { G.mode='cleared'; G.clearedT=0; rayBurst(W/2,H*0.34,'#4dff88',16,44,220); sfx('complete',1,1.1); }   // STAGE CLEAR interstitial → then the Dock (absorbs boss-kill button-mashing so you don't blast through the shop)
}
function startLoop(){   // second loop: same stages, harder + recolored, ending in the true final boss
  G.loop++; G.stage=0; // updateShift will ++ to 1
  G.banner='LOOP '+G.loop; G.subBanner='THE ENEMY REMEMBERS YOU'; G.bannerT=220;
  G.flash=20; G.flashColor='#c77dff'; shake(1); sfx('complete',1,0.6);
  // force next stage back to vertical regardless of current orientation
  startShift(); shiftTo='vertical';
}

/* =====================================================================
   RENDER
   ===================================================================== */
function drawPlayerShots(){
  CX.globalCompositeOperation='lighter';const PA=0.8;CX.globalAlpha=PA;   // player fire renders a touch translucent so a multi-slot firehose reads as energy, not a wall — enemy bullets draw SOLID and on top, keeping the screen legible
  for(const s of pShots){CX.fillStyle=s.color;
    if(s.explosive){ // rocket body + flame trail
      if(G.frame%2===0)parts.push({x:s.x,y:s.y,vx:0,vy:0,life:12,max:12,color:'#ff9d3d',size:2.4,g:0});
      const a=Math.atan2(s.vy,s.vx);CX.save();CX.translate(s.x,s.y);CX.rotate(a);
      CX.fillStyle='#ffca3a';CX.beginPath();CX.moveTo(s.r*1.5,0);CX.lineTo(-s.r*0.9,s.r*0.75);CX.lineTo(-s.r*0.9,-s.r*0.75);CX.closePath();CX.fill();
      CX.fillStyle='#fff';CX.fillRect(0,-s.r*0.28,s.r*0.8,s.r*0.56);CX.restore();}
    else if(s.laser){CX.save();CX.translate(s.x,s.y);CX.rotate(Math.atan2(s.vy,s.vx));CX.fillRect(-(s.len||20),-s.r/2,(s.len||20),s.r);CX.restore();}
    else if(s.big){CX.beginPath();CX.arc(s.x,s.y,s.r,0,TAU);CX.fill();CX.globalAlpha=PA*0.5;CX.beginPath();CX.arc(s.x,s.y,s.r+3,0,TAU);CX.fill();CX.globalAlpha=PA;}
    else if(s.boomerang){CX.save();CX.translate(s.x,s.y);CX.rotate((s.boom||0)*0.6);CX.strokeStyle=s.color;CX.lineWidth=s.r*0.85;CX.lineCap='round';CX.beginPath();CX.arc(0,0,s.r,0.7,TAU-0.7);CX.stroke();CX.restore();}
    else if(s.zap!==undefined){CX.globalAlpha=PA*0.6;CX.beginPath();CX.arc(s.x,s.y,s.r+3+Math.sin(G.t*0.4)*1.5,0,TAU);CX.fill();CX.globalAlpha=PA;CX.fillStyle='#eaffff';CX.beginPath();CX.arc(s.x,s.y,s.r*0.55,0,TAU);CX.fill();}
    else{const ang=Math.atan2(s.vy,s.vx);CX.save();CX.translate(s.x,s.y);CX.rotate(ang);CX.fillRect(-s.r*1.4,-s.r/2,s.r*2.8,s.r);CX.restore();}}
  CX.globalCompositeOperation='source-over';CX.globalAlpha=1;
}
// enemy bullets render ON TOP of everything (readability rule): solid core + glow,
// never additive-blended so they stay high-contrast over explosions.
function drawEnemyBullets(){
  for(const b of eShots){
    // outer glow (always) — keeps bullets the brightest, most readable thing
    CX.globalCompositeOperation='lighter';CX.globalAlpha=0.4;CX.fillStyle=b.color;
    CX.beginPath();CX.arc(b.x,b.y,b.r+2.5,0,TAU);CX.fill();
    CX.globalCompositeOperation='source-over';CX.globalAlpha=1;
    if(b.kind==='needle'){ // elongated dart pointing along travel
      CX.save();CX.translate(b.x,b.y);CX.rotate(Math.atan2(b.vy,b.vx));
      CX.fillStyle=b.color;CX.beginPath();CX.moveTo(b.r*2.2,0);CX.lineTo(-b.r,b.r*0.9);CX.lineTo(-b.r,-b.r*0.9);CX.closePath();CX.fill();
      CX.fillStyle='#fff';CX.fillRect(b.r*0.2,-b.r*0.3,b.r*0.9,b.r*0.6);CX.restore();
    } else if(b.kind==='plasma'){ // big pulsing orb
      const pr=b.r*(1+0.12*Math.sin(b.t*0.4));
      CX.fillStyle=b.color;CX.beginPath();CX.arc(b.x,b.y,pr,0,TAU);CX.fill();
      CX.globalCompositeOperation='lighter';CX.globalAlpha=0.5;CX.beginPath();CX.arc(b.x,b.y,pr+3,0,TAU);CX.fill();CX.globalAlpha=1;CX.globalCompositeOperation='source-over';
      CX.fillStyle='#fff';CX.beginPath();CX.arc(b.x-pr*0.3,b.y-pr*0.3,pr*0.4,0,TAU);CX.fill();
    } else if(b.kind==='rocket'){ // homing rocket w/ flame trail
      if(G.frame%2===0)parts.push({x:b.x,y:b.y,vx:0,vy:0,life:10,max:10,color:'#ff9d3d',size:2,g:0});
      CX.save();CX.translate(b.x,b.y);CX.rotate(Math.atan2(b.vy,b.vx));
      CX.fillStyle=b.color;CX.beginPath();CX.moveTo(b.r*1.8,0);CX.lineTo(-b.r,b.r);CX.lineTo(-b.r,-b.r);CX.closePath();CX.fill();CX.restore();
    } else { // orb (default) + wave share this look
      CX.fillStyle=b.color;CX.beginPath();CX.arc(b.x,b.y,b.r,0,TAU);CX.fill();
      CX.fillStyle='#fff';CX.beginPath();CX.arc(b.x-b.r*0.28,b.y-b.r*0.28,b.r*0.4,0,TAU);CX.fill();
    }
  }
}
function drawPickups(){for(const p of pickups){CX.save();CX.translate(p.x,p.y);
  const ammo=p.kind==='ammo', col=ammo?'#ff9d3d':'#ffd166';
  CX.globalCompositeOperation='lighter';CX.globalAlpha=0.5+0.3*Math.sin(p.t*0.2);CX.fillStyle=col;CX.beginPath();CX.arc(0,0,10,0,TAU);CX.fill();

    return;
  }
  if(pressed['arrowup']||pressed['w']){draft.sel=(draft.sel+n-1)%n;sfx('select',0.8,1);}

  if(pressed['activate']||pressed['enter'])draftConfirm();

function handleShopInput(){
  if(shop.modal){const m=shop.modal;   // modal traps ALL input until resolved
    if(m.type==='pick'){const n2=player.slots.length;
      if(pressed['arrowup']||pressed['w']){m.sel=(m.sel+n2-1)%n2;sfx('select',0.8,1);}
      if(pressed['arrowdown']||pressed['s']){m.sel=(m.sel+1)%n2;sfx('select',0.8,1);}
      if(justTapped)for(const r of m.rects){if(pointer.x>=r.x&&pointer.x<=r.x+r.w&&pointer.y>=r.y&&pointer.y<=r.y+r.h){shop.modal=null;applyPick(m.it,r.i);return;}}
      if(pressed['enter']||pressed['activate']){const idx=m.sel;shop.modal=null;applyPick(m.it,idx);return;}
      if(pressed['bomb']){shop.modal=null;sfx('deny',0.6,1);}
    } else {   // confirm — A/YES applies, B/NO cancels
      if(justTapped)for(const r of m.rects){if(pointer.x>=r.x&&pointer.x<=r.x+r.w&&pointer.y>=r.y&&pointer.y<=r.y+r.h){shop.modal=null;if(r.yes){if(m.apply)m.apply();else shopDoBuy(m.it);}else sfx('deny',0.6,1);return;}}
      if(pressed['enter']||pressed['activate']){shop.modal=null;if(m.apply)m.apply();else shopDoBuy(m.it);return;}
      if(pressed['bomb']){shop.modal=null;sfx('deny',0.6,1);}
    }
    return;
  }
  const sec=shop.sections[shop.tab]||[],n=sec.length;
  if(pressed['arrowleft']||pressed['a']){shop.tab=(shop.tab+2)%3;shop.sel=0;sfx('select',0.8,0.9);}
  if(pressed['arrowright']||pressed['d']){shop.tab=(shop.tab+1)%3;shop.sel=0;sfx('select',0.8,1.1);}
  if(n){
    if(pressed['arrowup']||pressed['w']){shop.sel=(shop.sel+n-1)%n;sfx('select',0.8,1);}
    if(pressed['arrowdown']||pressed['s']){shop.sel=(shop.sel+1)%n;sfx('select',0.8,1);}
  }
  if(justTapped&&shop.lock<=0){   // taps respect the same anti-mash lockout as the buttons below
    for(let i=0;i<shop.tabRects.length;i++){const r=shop.tabRects[i];if(pointer.x>=r.x&&pointer.x<=r.x+r.w&&pointer.y>=r.y&&pointer.y<=r.y+r.h){shop.tab=i;shop.sel=0;sfx('select',0.8,1);return;}}
    for(const r of shop.rects){if(pointer.x>=r.x&&pointer.x<=r.x+r.w&&pointer.y>=r.y&&pointer.y<=r.y+r.h){shop.sel=r.idx;shopBuy();return;}}
    if(shop.doneRect){const r=shop.doneRect;if(pointer.x>=r.x&&pointer.x<=r.x+r.w&&pointer.y>=r.y&&pointer.y<=r.y+r.h){shopDone();return;}}
  }
  if(shop.lock>0)shop.lock--;   // brief lockout so a carried-over mash from the boss kill can't insta-buy or depart
  else{ if(pressed['togglepod']){testFireEnter();return;} if(pressed['activate']||pressed['enter'])shopBuy(); if(pressed['bomb'])shopDone(); }   // F / pad-X = TEST FIRE · B / X = leave
}

const WC_SHORT={rapid:'RAP',shock:'SHK',railgun:'RAIL',detonation:'DET'};
function loadoutStr(){return player.slots.map((sl,i)=>'S'+(i+1)+'·'+sl.w.toUpperCase()+(player.wEvo[sl.w]?'✦':'')+(sl.dbl?'×2':'')+(sl.core?'+'+WC_SHORT[sl.core]:'')).join('   ');}   // compact "what am I actually firing" line

  juggernaut:{hull:5, speed:2, agility:2, gun:'Lock Laser + Aegis'},

function weaponNums(w,lvl){  // representative current numbers for the readout
  const rate=(60/(WEAPON_DEFS[w].cd||6)).toFixed(1); let dmg,shots;
  switch(w){
    case 'pulse': dmg=(2+(lvl-1)*0.6).toFixed(1); shots=Math.min(2+lvl,7); break;
    case 'laser': dmg=3+lvl; shots=1+(lvl>=4?2:lvl>=2?1:0); break;
    case 'missile': dmg='3.5'; shots=Math.min(lvl,5); break;
    case 'hex': dmg=3+lvl; shots=lvl>=3?3:1; break;
    case 'rail': dmg=8+lvl*2; shots=1; break;
    case 'arc': dmg=(4+lvl*1.2).toFixed(1); shots=lvl>=3?2:1; break;
    case 'flak': dmg=(2+lvl*0.6).toFixed(1); shots=4+lvl; break;
    case 'scythe': dmg=3+lvl; shots=lvl>=4?3:lvl>=2?2:1; break;
    case 'tesla': dmg=(3+lvl*0.9).toFixed(1); shots=1; break;
    default: dmg=2; shots=1;
  }
  return {dmg, shots, rate};
}
/* ===== ARCLIGHT design system — holographic glass panels + neon type + volumetric light (fused neon-noir · command-deck · arcane) ===== */
const UI={cyan:'#3df0ff',mag:'#ff2f8e',violet:'#b98bff',gold:'#ffd166',green:'#4dff88',ice:'#8fd8ff',ink:'#eaffff',dim:'#8fb0cc',faint:'#5a7a92'};
const F_DISP="'Bahnschrift','DIN Alternate','Oswald','Arial Narrow',sans-serif";   // DISPLAY face — a condensed industrial sans for titles/headers, so the game isn't one monospace at every size. HUD data stays mono (that's correct for a readout).
function neonText(txt,x,y,size,col,align,weight){   // layered-glow text — display face for headings (size≥20), terminal mono for labels/data
  CX.textAlign=align||'left';CX.font=(weight||'bold')+' '+size+'px '+(size>=20?F_DISP:"'Courier New',monospace");
  CX.save();CX.globalCompositeOperation='lighter';CX.globalAlpha=0.5;CX.fillStyle=col;CX.fillText(txt,x,y);CX.restore();
  CX.fillStyle=col;CX.fillText(txt,x,y);
}
function holoPanel(x,y,w,h,col,opts){   // translucent glass + scanlines + glowing neon edge + arcane corner ticks
  opts=opts||{};col=col||UI.cyan;const r=opts.r==null?9:opts.r;
  CX.fillStyle=opts.fill||'rgba(9,15,27,0.84)';roundRect(x,y,w,h,r);CX.fill();
  if(opts.scan!==false){CX.save();roundRect(x,y,w,h,r);CX.clip();CX.globalAlpha=0.045;CX.strokeStyle=col;CX.lineWidth=1;
    for(let sy=y+3;sy<y+h;sy+=4){CX.beginPath();CX.moveTo(x,sy);CX.lineTo(x+w,sy);CX.stroke();}CX.restore();}
  CX.save();CX.globalCompositeOperation='lighter';CX.globalAlpha=opts.glow==null?0.55:opts.glow;CX.strokeStyle=col;CX.lineWidth=2.2;roundRect(x,y,w,h,r);CX.stroke();CX.restore();
  CX.strokeStyle=col;CX.globalAlpha=0.85;CX.lineWidth=1;roundRect(x,y,w,h,r);CX.stroke();CX.globalAlpha=1;
  if(opts.corners!==false){const c=9;CX.strokeStyle=col;CX.lineWidth=2;CX.lineCap='round';CX.globalAlpha=0.95;
    const P=[[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]];
    for(const q of P){CX.beginPath();CX.moveTo(q[0]+q[2]*c,q[1]);CX.lineTo(q[0],q[1]);CX.lineTo(q[0],q[1]+q[3]*c);CX.stroke();}CX.globalAlpha=1;}
}
function godrayField(cx,cy,n,spread,len,seed){   // animated volumetric light shafts fanning from a point (ray-traced backdrop)
  CX.save();CX.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){const a=-Math.PI/2+(i-(n-1)/2)*spread+Math.sin(G.t*0.01+i*1.3)*0.025,hue=(G.t*0.5+i*36+(seed||0))%360;
    CX.save();CX.translate(cx,cy);CX.rotate(a);
    const g=CX.createLinearGradient(0,0,len,0);g.addColorStop(0,'hsla('+hue+',90%,72%,0.13)');g.addColorStop(1,'hsla('+hue+',90%,72%,0)');
    CX.fillStyle=g;CX.beginPath();CX.moveTo(0,-14);CX.lineTo(len,-len*0.2);CX.lineTo(len,len*0.2);CX.lineTo(0,14);CX.closePath();CX.fill();CX.restore();}
  CX.restore();
}
function drawPips(x,y,label,val,col){   // label + N filled of 5

}

const MBOOM=[];
function drawMenuBooms(){
  if(MBOOM.length<3&&G.frame%110===0)MBOOM.push({x:rand(50,W-50),y:rand(60,H*0.52),age:rand(0,6),hue:pick([18,330,190,268,45]),R:rand(55,115),seed:rand(1000)});
  CX.save();CX.globalCompositeOperation='lighter';
  for(let i=MBOOM.length-1;i>=0;i--){const b=MBOOM[i];b.age+=0.22;   // slow-mo: a full detonation takes ~4.5s
    const t=b.age/60; if(t>=1){MBOOM.splice(i,1);continue;}
    const R=b.R*(0.18+t*0.82), fade=(1-t)*(1-t*0.3);
    const g=CX.createRadialGradient(b.x,b.y,0,b.x,b.y,R);   // expanding fireball
    g.addColorStop(0,'hsla('+b.hue+',100%,86%,'+(0.5*fade)+')');g.addColorStop(0.45,'hsla('+b.hue+',95%,60%,'+(0.32*fade)+')');g.addColorStop(1,'hsla('+b.hue+',95%,50%,0)');
    CX.fillStyle=g;CX.beginPath();CX.arc(b.x,b.y,R,0,TAU);CX.fill();
    CX.globalAlpha=fade;CX.fillStyle='#fff';CX.beginPath();CX.arc(b.x,b.y,Math.max(1.2,R*0.13*(1-t*0.75)),0,TAU);CX.fill();   // white-hot core
    CX.globalAlpha=fade*0.55;CX.strokeStyle='hsla('+b.hue+',92%,76%,1)';CX.lineWidth=2;
    CX.beginPath();CX.arc(b.x,b.y,R*1.18,0,TAU);CX.stroke();   // shockwave rings
    CX.globalAlpha=fade*0.25;CX.lineWidth=1.4;CX.beginPath();CX.arc(b.x,b.y,R*1.5,0,TAU);CX.stroke();
    CX.globalAlpha=fade*0.65;CX.fillStyle='hsla('+b.hue+',95%,74%,1)';   // radiant light shards
    for(let k=0;k<8;k++){const a=b.seed+k/8*TAU,ln=R*1.7*(0.55+((k*37+Math.floor(b.seed))%10)/16),wd=3.2*fade;
      CX.save();CX.translate(b.x,b.y);CX.rotate(a);CX.beginPath();CX.moveTo(R*0.18,-wd);CX.lineTo(ln,0);CX.lineTo(R*0.18,wd);CX.closePath();CX.fill();CX.restore();}
    for(let k=0;k<10;k++){const a=b.seed*2+k/10*TAU,d=R*(0.55+t*0.85);   // drifting embers
      CX.globalAlpha=fade*0.8;CX.fillStyle=k%3?'#ffd7a0':'#eaffff';CX.fillRect(b.x+Math.cos(a)*d-1,b.y+Math.sin(a)*d*0.9-1,2,2);}
    CX.globalAlpha=1;
  }
  CX.restore();
}

  p.droneSlot=META.droneSlot?(s.droneSlot?{...s.droneSlot}:{w:'pulse',core:null,dbl:false}):null;
  p.speedLevel=s.speedLevel; p.focusLvl=s.focusLvl; p.bombCap=s.bombCap;
  p.podLvl=s.podLvl; p.podStance=s.podStance; p.podCores={...s.podCores};
  p.shieldLvl=s.shieldLvl; p.droneLvl=s.droneLvl; p.magnetLvl=s.magnetLvl; p.salvageLvl=s.salvageLvl;
  p.wCores={...s.wCores}; p.wCoreEvo={...s.wCoreEvo}; p.fireCount=0;
  p.xp=s.xp; p.xpMax=s.xpMax; p.pendingLevels=s.pendingLevels;
  p.dmgMul=s.dmgMul; p.fireMul=s.fireMul; p.grazeMul=s.grazeMul; p.relics={...s.relics};
  p.missiles=s.missiles; p.maxhp=s.maxhp; p.hp=s.maxhp;
  p.shieldReady=p.shieldLvl>0; p.shieldCd=0; p.alive=true; p.iframes=120; p.fireCd=0; p.stealAmmo=0; p.stealType=null;
  p.x=W/2; p.y=G.orient==='vertical'?H*0.78:H/2; if(p.pod)p.pod.attached=true;
  spawner.reset(); initStageDecor(); tut.active=false;
  G.mode='play'; music('stage'+(((G.stage-1)%4)+1));
  G.banner='STAGE '+G.stage+': '+curStage().name; G.subBanner='◈ CHECKPOINT RESUMED'; G.bannerT=150;
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last=now();
function loop(){
  const tnow=now();let dt=(tnow-last)/16.6667;last=tnow;dt=clamp(dt,0,3)*OPT.speed;   // OPTIONS → GAME SPEED (50–100%) scales the whole simulation
  G.t+=dt;G.frame++;
  if((G.mode==='play'||G.mode==='boss')&&!G.paused)G.runT=(G.runT||0)+dt/60;   // run time in seconds (for the end-screen summary)
  pollGamepad();
  // input aliases
  if(pressed[' '])pressed['activate']=true;
  if(pressed['f'])pressed['togglepod']=true;
  if(pressed['v'])pressed['podstance']=true;
  if(pressed['x']||pressed['b'])pressed['bomb']=true;
  if(pressed['p']&&(G.mode==='play'||G.mode==='boss')){G.paused=!G.paused;if(G.paused){G.pauseSel=0;G.pauseView='menu';delete pressed['enter'];delete pressed['activate'];}}   // consume Start's coincident confirm so it can't insta-resume
  if(pressed['m'])toggleMute();

  CX.clearRect(0,0,W,H);

  if(G.mode==='credits'){   // CREDITS — any confirm/back/tap returns to the title
    if(pressed['enter']||pressed['activate']||pressed['bomb']||pressed['c']||pressed['togglepod']||justTapped){sfx('confirm',0.7,0.9);G.mode='title';}
    drawCredits();drawTouchBack();clearPressed();requestAnimationFrame(loop);return;}

  if(G.mode==='title'){
    music('menu');
    if(pressed['c']||pressed['togglepod']||(justTapped&&pointer.y>H*0.955)){sfx('confirm',0.8,1.1);G.mode='credits';}   // C / pad-X / tap the bottom line = CREDITS
    else if(pressed['enter']||pressed['activate']||justTapped){sfx('confirm',1,1);G.mode='saveselect';G.saveSel=0;G.savePick=null;}
    drawTitle();clearPressed();requestAnimationFrame(loop);return;}

  if(G.mode==='saveselect'){   // SAVE BAYS: continue a bay, or start a new run in one (overwrite confirm on filled bays)
    const bays=[1,2,3].map(n=>loadSavedCheckpoint(n));
    if(G.savePick!=null){   // filled bay chosen → CONTINUE / NEW GAME sub-choice
      if(pressed['arrowup']||pressed['w']||pressed['arrowdown']||pressed['s']){G.savePickSel=1-G.savePickSel;sfx('select',0.8,1);}
      if(justTapped&&G.savePickRects)for(const r of G.savePickRects){if(pointer.x>=r.x&&pointer.x<=r.x+r.w&&pointer.y>=r.y&&pointer.y<=r.y+r.h){G.savePickSel=r.i;pressed['enter']=true;break;}}
      if(pressed['enter']||pressed['activate']){sfx('confirm',1,1.05);const n=G.savePick;G.savePick=null;
        if(G.savePickSel===0){G.saveSlot=n;G.checkpoint=bays[n-1];applyCheckpoint(G.checkpoint);clearPressed();requestAnimationFrame(loop);return;}   // CONTINUE
        else{G.saveSlot=n;clearCheckpoint();G.mode='difficulty';G.diffSel=1;}}   // NEW GAME (overwrites this bay's save as the run checkpoints)
      else if(pressed['bomb']){G.savePick=null;sfx('deny',0.6,1);}
    } else {
      const NS=5;   // 3 save bays + BOSS RUSH + PRACTICE
      if(pressed['arrowup']||pressed['w']){G.saveSel=(G.saveSel+NS-1)%NS;sfx('select',0.8,1);}
      if(pressed['arrowdown']||pressed['s']){G.saveSel=(G.saveSel+1)%NS;sfx('select',0.8,1);}
      if(justTapped&&G.saveRects)for(const r of G.saveRects){if(pointer.x>=r.x&&pointer.x<=r.x+r.w&&pointer.y>=r.y&&pointer.y<=r.y+r.h){G.saveSel=r.i;pressed['enter']=true;break;}}
      if((pressed['enter']||pressed['activate'])&&G.saveSel>=3){sfx('confirm',1,1);G.saveSlot=0;G.checkpoint=null;G.diffSel=1;   // bay 0 = none: rush/practice never write a save bay
        if(G.saveSel===3){G.runMode='bossrush';G.mode='difficulty';} else {G.runMode='practice';G.pickStage=practiceMax();G.mode='stagepick';}}
      else if(pressed['enter']||pressed['activate']){const bay=bays[G.saveSel];G.runMode='campaign';
        if(bay){G.savePick=G.saveSel+1;G.savePickSel=0;sfx('select',1,1.1);}
        else{sfx('confirm',1,1);G.saveSlot=G.saveSel+1;G.checkpoint=null;G.mode='difficulty';G.diffSel=1;}}
      else if(pressed['bomb']){G.mode='title';sfx('confirm',0.7,0.9);}
    }
    drawSaveSelect(bays);drawTouchBack();clearPressed();requestAnimationFrame(loop);return;}

  if(G.mode==='stagepick'){   // PRACTICE: choose a stage you've reached, then difficulty → ship
    const mx=practiceMax();
    if(pressed['arrowup']||pressed['w']||pressed['arrowright']||pressed['d']){G.pickStage=G.pickStage%mx+1;sfx('select',0.8,1.1);}
    if(pressed['arrowdown']||pressed['s']||pressed['arrowleft']||pressed['a']){G.pickStage=(G.pickStage+mx-2)%mx+1;sfx('select',0.8,0.9);}
    if(justTapped){ if(pointer.x<W*0.3){G.pickStage=(G.pickStage+mx-2)%mx+1;sfx('select',0.8,0.9);} else if(pointer.x>W*0.7){G.pickStage=G.pickStage%mx+1;sfx('select',0.8,1.1);} else pressed['enter']=true; }
    if(pressed['enter']||pressed['activate']){sfx('confirm',1,1.1);G.mode='difficulty';G.diffSel=1;}
    else if(pressed['bomb']){G.mode='saveselect';sfx('confirm',0.7,0.9);}
    drawStagePick(mx);drawTouchBack();clearPressed();requestAnimationFrame(loop);return;}

  if(G.mode==='difficulty'){
    // confirm is evaluated BEFORE nav so a coincident repeat-step can't commit a different difficulty
    let tapGo=false;   // touch: tap a card to select it, tap the selected card again to launch
    if(justTapped)for(let i=0;i<DIFF_KEYS.length;i++){const yy=H*0.36+i*118;if(pointer.x>=W/2-170&&pointer.x<=W/2+170&&pointer.y>=yy-34&&pointer.y<=yy+66){if(i===G.diffSel)tapGo=true;else{G.diffSel=i;sfx('select',1,1);}}}
    if(pressed['enter']||pressed['activate']||tapGo){G.diffKey=DIFF_KEYS[G.diffSel];sfx('confirm',1,1.1);G.mode='shipselect';G.shipSel=SHIP_KEYS.indexOf(G.ship);if(G.shipSel<0)G.shipSel=0;}
    else{
      if(pressed['arrowup']||pressed['w']){G.diffSel=(G.diffSel+2)%3;sfx('select',1,1);}
      if(pressed['arrowdown']||pressed['s']){G.diffSel=(G.diffSel+1)%3;sfx('select',1,1);}
      if(pressed['bomb']){G.mode='saveselect';sfx('confirm',0.7,0.9);}   // B / X = back (matches ship select)
    }
    drawDifficulty();drawTouchBack();clearPressed();requestAnimationFrame(loop);return;}

  if(G.mode==='shipselect'){
    let tapGo=false;   // touch: tap a card to select it, tap the selected card again to launch
    if(justTapped)for(let i=0;i<SHIP_KEYS.length;i++){const yy=H*0.2+i*118;if(pointer.x>=W/2-186&&pointer.x<=W/2+186&&pointer.y>=yy-30&&pointer.y<=yy+74){if(i===G.shipSel)tapGo=true;else{G.shipSel=i;sfx('select',1,1);}}}
    if(pressed['enter']||pressed['activate']||tapGo){G.ship=SHIP_KEYS[G.shipSel];sfx('confirm',1,1.15);fullReset();G.mode='play';music('stage1');G.banner='STAGE 1: '+STAGES[0].name;G.subBanner=null;G.bannerT=130;
      if(G.runMode==='practice')startPractice(G.pickStage);
      else if(G.runMode==='bossrush'){tut.active=false;G.banner='BOSS RUSH';G.subBanner='every boss · bonus scrap + a level-up per kill';G.bannerT=170;}}
    else{
      if(pressed['arrowup']||pressed['w']){G.shipSel=(G.shipSel+SHIP_KEYS.length-1)%SHIP_KEYS.length;sfx('select',1,1);}
      if(pressed['arrowdown']||pressed['s']){G.shipSel=(G.shipSel+1)%SHIP_KEYS.length;sfx('select',1,1);}
      if(pressed['bomb']){G.mode='difficulty';sfx('confirm',0.7,0.9);}   // B / X = back
    }
    drawShipSelect();drawTouchBack();clearPressed();requestAnimationFrame(loop);return;}

  if(G.mode==='over'||G.mode==='win'){
    G.endT=(G.endT||0)+dt; if(G.endT<=70)clearPressed();   // ~1.2s input lockout (like STAGE CLEAR) — a bomb-mash while dying can't hit GIVE UP and wipe the save bay
    if(G.mode==='win'&&G.canLoop2){   // loop-1 win: carry on into LOOP 2, or end the run
      if(pressed['enter']||pressed['activate']||justTapped){sfx('confirm',1,1.1);G.canLoop2=false;G.maxLoop=2;G.prestigeNew=false;startLoop();clearPressed();requestAnimationFrame(loop);return;}
      if(pressed['bomb']){G.canLoop2=false;sfx('confirm',0.7,0.9);clearCheckpoint();G.mode='title';G.stage=1;G.orient='vertical';initStageDecor();clearPressed();requestAnimationFrame(loop);return;}
    }
    const cp=(G.mode==='over')&&hasCheckpoint();
    if(cp&&(pressed['enter']||justTapped)){sfx('confirm',1,1.05);applyCheckpoint(G.checkpoint);clearPressed();requestAnimationFrame(loop);return;}   // CONTINUE from last checkpoint
    if((pressed['enter']||justTapped)||(cp&&pressed['bomb'])){   // RETRY→title (victory / no-checkpoint death), or GIVE UP from a checkpointed death
      sfx('confirm',1,1);if(G.mode==='win'||cp)clearCheckpoint();
      G.mode='title';G.stage=1;G.orient='vertical';initStageDecor();clearPressed();requestAnimationFrame(loop);return;}
    renderScene(0);drawEnd(G.mode==='win'?({bossrush:'RUSH COMPLETE',practice:'PRACTICE CLEAR'}[G.runMode]||'TRUE VICTORY'):'DESTROYED',G.mode==='win'?'#4dff88':'#ff3b3b');drawTouchBack();
    clearPressed();requestAnimationFrame(loop);return;}

  if(G.paused){
    if(G.pauseView==='controls'){
      if(pressed['bomb']||pressed['enter']||pressed['activate']||justTapped)G.pauseView='menu';   // back
    } else if(G.pauseView==='options'){ handleOptionsInput();
    } else {
      const N=PAUSE_ROWS.length; let tapHit=false;
      if(justTapped)for(let i=0;i<N;i++){const y=PAUSE_Y0+i*PAUSE_DY;if(pointer.x>=W/2-130&&pointer.x<=W/2+130&&pointer.y>=y-18&&pointer.y<=y+16){G.pauseSel=i;tapHit=true;}}
      if(pressed['arrowup']||pressed['w']){G.pauseSel=(G.pauseSel+N-1)%N;sfx('select',0.8,1);}
      if(pressed['arrowdown']||pressed['s']){G.pauseSel=(G.pauseSel+1)%N;sfx('select',0.8,1);}
      if(pressed['enter']||pressed['activate']||tapHit){sfx('confirm',1,1);PAUSE_ROWS[G.pauseSel].act();}   // tap only confirms when it lands on a row
    }
    renderScene(0);drawPauseMenu();drawTouchBack();clearPressed();requestAnimationFrame(loop);return;}

  // level-up draft (pauses the action, pick 1 of 3)
  if(G.mode==='draft'){ updateParticles(dt); handleDraftInput(); renderScene(0); drawDraft(); clearPressed();requestAnimationFrame(loop);return; }
  // STAGE CLEAR victory interstitial — plays after a boss kill, before the Dock, and ignores input for ~1.2s so mid-fight button-mashing doesn't blast through the shop
  if(G.mode==='cleared'){
    G.clearedT+=dt; updateParticles(dt); if(G.bannerT>0)G.bannerT-=dt;
    renderScene(0); drawStageClear();
    if(G.clearedT>70 && (pressed['enter']||pressed['activate']||justTapped||G.clearedT>440)) openShop();   // deliberate press (after lockout), or auto-advance ~7s
    clearPressed();requestAnimationFrame(loop);return;
  }
  // between-stage shop
  if(G.mode==='shop'){
    if(TF.on){ if(pressed['togglepod']||pressed['bomb']||pressed['enter']||justTapped)testFireExit(); else{testFireUpdate(dt);} if(TF.on)testFireDraw(); else{renderScene(0);drawShop();} clearPressed();requestAnimationFrame(loop);return; }   // TEST FIRE range traps input
    updateParticles(dt); handleShopInput(); renderScene(0); drawShop(); clearPressed();requestAnimationFrame(loop);return; }

  // hitstop
  if(G.freeze>0){G.freeze-=dt;renderScene(0);clearPressed();requestAnimationFrame(loop);return;}

  // update
  if(G.mode==='play'||G.mode==='boss'){
    player.update(dt);spawner.update(dt);maybeStartBoss();
    if(G.mode==='boss'&&boss)updateBoss(dt);
    updateWorld(dt);updateBeams(dt);updateParticles(dt);
    if(G.stage===1&&tut.active)tut.t+=dt;
    // meter full → BANK a level-up (doesn't interrupt); player opens it when ready
    while(player.alive&&player.xp>=player.xpMax){player.xp-=player.xpMax;player.xpMax=Math.ceil(player.xpMax*1.3);player.pendingLevels++;
      floatText(player.x,player.y-30,'LEVEL UP!','#7dffb0',13);ring(player.x,player.y,'#7dffb0',6,44,18);sfx('powerup',0.7,1.2);}
  }
  else if(G.mode==='shift'){updateShift(dt);updateParticles(dt);}
  if(G.bannerT>0)G.bannerT-=dt;
  if(G.trauma>0)G.trauma=clamp(G.trauma-0.028*dt,0,1);   // faster settle — shake was lingering too long
  if(G.flash>0)G.flash-=dt;

  renderScene(dt);
  clearPressed();requestAnimationFrame(loop);
}
function renderScene(dt){
  CX.save();
  const tr=G.trauma*G.trauma;
  const sk=8*OPT.shake*(OPT.motion?1:0);   // OPTIONS → SCREEN SHAKE; reduced motion turns it off
  if(tr>0&&sk>0)CX.translate(rand(-1,1)*tr*sk,rand(-1,1)*tr*sk);   // toned down (was 14px max) — screen shake read as too intense
  if(G.mode==='shift'){ // seamless whip-pan: tilt+zoom out to the midpoint, then in from the other side
    const p=clamp(shiftT/SHIFT_DUR,0,1);
    const dir=shiftTo==='horizontal'?1:-1;
    const half=p<0.5?p*2:(1-p)*2;             // 0→1→0 across the whip
    const ease=half*half*(3-2*half);          // smoothstep
    const sign=p<0.5?1:-1;                     // second half arrives from the opposite side
    if(OPT.motion){CX.translate(W/2,H/2);CX.rotate(dir*sign*ease*0.5);const z=1-0.2*ease;CX.scale(z,z);CX.translate(-W/2,-H/2);}}   // reduced motion: no whip-pan spin/zoom
  drawBackground(dt||1);
  drawPickups();drawPlayerShots();
  for(const e of enemies)drawEnemy(e);
  if(boss)drawBoss();
  if(player.pod)player.pod.draw();
  player.draw();
  drawParticles();
  drawBeams();          // boss lasers above entities…
  drawEnemyBullets();   // …but bullets always on top for readability
  CX.restore();
  if(G.flash>0&&OPT.flash>0){CX.globalAlpha=clamp(G.flash/20,0,0.6)*OPT.flash;CX.fillStyle=G.flashColor;CX.fillRect(0,0,W,H);CX.globalAlpha=1;}   // OPTIONS → FLASHES
  if(G.mode==='shift'){
    const p=clamp(shiftT/SHIFT_DUR,0,1);
    // ray-traced-style prismatic god-rays sweeping through the whip-pan (chromatic light refraction)
    const streak=clamp(1-Math.abs(p-0.5)*2.4,0,1);
    if(streak>0&&OPT.motion){CX.save();CX.globalCompositeOperation='lighter';CX.translate(W/2,H/2);CX.rotate(shiftT*0.05);
      for(let i=0;i<16;i++){const a=i/16*TAU,hue=(i/16*360+shiftT*7)%360;
        CX.strokeStyle=`hsla(${hue},95%,66%,${streak*0.3})`;CX.lineWidth=1.5+streak*3;
        CX.beginPath();CX.moveTo(Math.cos(a)*70,Math.sin(a)*70);CX.lineTo(Math.cos(a)*(300+streak*320),Math.sin(a)*(300+streak*320));CX.stroke();}
      CX.restore();}
    // flash mask peaks exactly at the swap (p=0.5), hiding the reorientation
    const m=clamp(1-Math.abs(p-0.5)*4,0,1);
    if(m>0){CX.globalAlpha=m*0.9;CX.fillStyle='#dff4ff';CX.fillRect(0,0,W,H);CX.globalAlpha=1;}
  }
  if(G.mode!=='shop'){drawHUD();drawBanner();}   // the Dock is a full-screen menu — the flight HUD would ghost through its header
  if(TOUCH.on&&inPlay())drawTouchButtons();   // on-screen controls appear once a finger has touched the screen
}
function clearPressed(){for(const k in pressed)delete pressed[k];justTapped=false;}
addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.repeat)pressed['enter']=true;});   // safety net if keys['enter'] sticks after a lost keyup — but ignores OS key-repeat, or holding Enter would mass-buy and skip every are-you-sure
applyOpts();   // saved volumes into the mix before the first track plays
// OFFLINE / INSTALL: register the service worker only when hosted for real (http/https, not localhost) — file:// can't use one,
// and on the dev server it would cache stale builds. sw.js + precache.json come from `node tools/build_web.js`.
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}

player.reset();
(function(){const leg=lsGet('best_checkpoint');if(leg&&!lsGet('best_save1')){lsSet('best_save1',leg);lsSet('best_checkpoint','');}})();   // migrate the old single-save into BAY 1
G.checkpoint=loadSavedCheckpoint();   // active bay (1) — the SAVE BAYS screen switches this when you pick a bay
requestAnimationFrame(loop);
</script>

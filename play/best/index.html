<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>BEST — Blast Everything in Space Time</title>
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04050c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="BEST — Blast Everything in Space Time: a cyberpunk-fantasy scrolling shooter with weapon slots, 3D bosses and boss rush. Keyboard, gamepad and touch.">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#cfe9ff}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0a0e1c 0%,#02030a 70%)}
  #game{image-rendering:auto;background:#04050c;box-shadow:0 0 60px rgba(61,240,255,.15), inset 0 0 40px rgba(0,0,0,.9);border:1px solid #16324a;max-width:100vw;max-height:100vh;touch-action:none}
  #hint{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:#3b5875;letter-spacing:1px;text-align:center;pointer-events:none}
  @media (max-width:820px){#hint{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="720"></canvas></div>
<div id="hint">KBD: move WASD/arrows · focus shift · missile C · level-up space · bomb X · drone F · pause P &nbsp;|&nbsp; 🎮 PAD: move stick · LB/LT focus · RB/RT missile · A level-up · B bomb · X drone · Start pause</div>
<script>
"use strict";
/* ===================================================================
   BEST — Blast Everything in Space Time  (v11)
   Single-file cyberpunk-fantasy shmup. Real sprite + audio assets with
   procedural/synth fallback so it runs even if assets are missing.
   Design driven by shmup research: hitstop, trauma shake, death spectacle,
   forgiving respawn, bombs, hidden dynamic rank, chain scoring,
   telegraphed multi-phase bosses, honest difficulty modes.
   =================================================================== */

const CV=document.getElementById('game'), CX=CV.getContext('2d');
const W=CV.width, H=CV.height;
// CRISPNESS: the game's logical design space is W×H (480×720). Instead of rendering into a fixed 480×720
// buffer and letting the browser upscale it (blurry/blocky vectors + text), we size the backing store to the
// ACTUAL on-screen pixels × devicePixelRatio and scale the context so all W×H-space drawing maps onto it 1:1.
// Every draw site uses W/H logical coords and balanced save/restore, so the base transform below is preserved.
function fit(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  const cssW=Math.floor(W*s),cssH=Math.floor(H*s);
  CV.style.width=cssW+'px';CV.style.height=cssH+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);   // render at true device pixels (capped at 2× so fill-rate stays sane on this additive-heavy bullet field)
  const bw=Math.max(W,Math.round(cssW*dpr)),bh=Math.max(H,Math.round(cssH*dpr));
  if(CV.width!==bw||CV.height!==bh){CV.width=bw;CV.height=bh;}   // NOTE: assigning width/height RESETS all ctx state (transform + smoothing) — both reapplied below
  CX.setTransform(bw/W,0,0,bh/H,0,0);                 // map the 480×720 logical space onto the hi-res backing store
  CX.imageSmoothingEnabled=true;CX.imageSmoothingQuality='high';
}
addEventListener('resize',fit); fit();

/* ---------- helpers ---------- */
const TAU=Math.PI*2;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b));
const pick=a=>a[randi(0,a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const now=()=>performance.now();
// localStorage can throw (sandboxed iframe / private mode) — never let a high-score read abort the game
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
// player OPTIONS (pause → OPTIONS), persisted. Everything reads OPT at use time, so a change applies immediately.
const OPT_DEFAULT={music:0.8,sfx:0.55,shake:1,flash:1,speed:1,motion:true,hitbox:false,rumble:true,tips:true};
const OPT=Object.assign({},OPT_DEFAULT,(()=>{try{return JSON.parse(lsGet('best_opts')||'{}')||{};}catch(e){return {};}})());
function saveOpts(){lsSet('best_opts',JSON.stringify(OPT));}
const META={droneSlot:lsGet('best_meta_droneslot')==='1', loop2:lsGet('best_meta_loop2')==='1'};   // loop2: first TRUE VICTORY also unlocks LOOP 2 (offered on the win screen)   // PRESTIGE unlocks (persist across runs): TRUE VICTORY grants the DRONE HARDPOINT — a weapon slot on your drone

/* =====================================================================
   ASSET LOADING (images)
   ===================================================================== */
const IMG={};
function loadImg(name,src){const im=new Image();im.onerror=()=>{im._failed=true;};im.src=src;IMG[name]=im;}
function imgReady(im){return im&&im.naturalWidth>0&&!im._failed;}
// player + enemy ship sprites (extracted, all point UP)
loadImg('player','assets/ships/ship20.png');
loadImg('grunt','assets/ships/ship13.png');
loadImg('fighter','assets/ships/ship16.png');
loadImg('weaver','assets/ships/ship09.png');
loadImg('squad','assets/ships/ship05.png');
loadImg('dart','assets/ships/ship03.png');
loadImg('miniboss','assets/ships/ship07.png');
loadImg('elite','assets/ships/ship14.png');
loadImg('carrier','assets/ships/ship19.png');
loadImg('shielder','assets/ships/ship12.png');
loadImg('drone','assets/ships/ship01.png');
// distinct chassis sprites for the 4 ships
loadImg('ship_enforcer','assets/ships/ship20.png');
loadImg('ship_juggernaut','assets/ships/ship07.png');
loadImg('ship_wraith','assets/ships/ship14.png');
loadImg('ship_artificer','assets/ships/ship05.png');
// ---- 3D BOSS fly-in sheets (pre-baked from .glb via tools/bake_boss.html; every sheet uses this grid) ----
const BOSS_SHEET={frames:32,cols:8,cell:256};   // 8×4 grid of 256px cells → 2048×1024 sheet
const BOSS_SPRITE_K=4.2;                          // on-screen draw size = boss.r × this (visible hull ≈ 2.4× the hitbox)
const BOSS_CINE_DUR=112;                          // fly-in length in 60fps-frame units (~1.9s) — room for the wormhole to open before the ship emerges
const WORM_EMERGE=0.26;                            // fraction of the fly-in spent opening the wormhole before the ship shoots out
['battleship','cartoon','craft1','craft2','fighter','fightercraft','pod','sgen','ship5','sship1','sship2','sship3']
  .forEach(n=>loadImg('boss_'+n,'assets/bosses/'+n+'.png'));   // baked 3D boss fly-in sheets (tools/bake_boss.html). Keyed 'boss_'+name so a sheet never overwrites an enemy sprite of the same name (e.g. 'fighter')
// DATA-DRIVEN: which ship flies in as each stage's boss. Auto-assigned (lighter fighters early, heavies/aliens on milestones) — reassign freely.
const BOSS_MODELS={
  1:'cartoon',  2:'pod',      3:'ship5',       4:'craft1',   5:'fighter',
  6:'craft2',   7:'fightercraft', 8:'sship3',  9:'sship2',  10:'battleship',
  11:'craft1', 12:'fighter',  13:'craft2',    14:'fightercraft', 15:'sgen',
  16:'cartoon',17:'pod',      18:'sship3',    19:'sship2',
  // gauntlet stages (20+) fly TWO bosses: [escort, finale] — different ships, and stage 20's pair shares none with stage 25's
  20:['sship3','battleship'], 21:['craft1','fighter'], 22:['pod','craft2'],
  23:['ship5','sgen'],        24:['fightercraft','sship2'], 25:['sgen','sship1']
};
// the sheet for one boss: a plain name, or [escort…, finale] picked by the boss's place in the gauntlet
function bossModelFor(stage,bseq,isLast){ const m=BOSS_MODELS[stage]; if(!Array.isArray(m)) return m||null;
  return isLast?m[m.length-1]:m[Math.min(bseq,m.length-2)]; }

/* draw a sprite centered, with rotation; returns false if not loaded */
function sprite(name,x,y,scale,rot,alpha){
  const im=IMG[name]; if(!imgReady(im)) return false;
  CX.save(); CX.translate(x,y); if(rot) CX.rotate(rot); if(alpha!=null)CX.globalAlpha=alpha;
  CX.imageSmoothingEnabled=false;
  const w=im.naturalWidth*scale, h=im.naturalHeight*scale;
  CX.drawImage(im,-w/2,-h/2,w,h); CX.restore(); return true;
}
// facing rotations for orientation (sprites point up by default)
function faceRot(isEnemy){
  if(G.orient==='vertical') return isEnemy?Math.PI:0;
  return isEnemy?-Math.PI/2:Math.PI/2;
}

/* =====================================================================
   AUDIO — pooled HTMLAudio (works from file:// AND server). Restrained mix.
   Synth fallback via WebAudio for shots if files missing.
   ===================================================================== */
const AUDIO={muted:false, sfxVol:0.55, musicVol:0.8, unlocked:false};   // music turned up (was 0.42 — barely audible under the SFX)
const SND={};
function loadSfx(name,src,vol=1,poolN=5){
  const pool=[]; for(let i=0;i<poolN;i++){const a=new Audio();a.src=src;a.preload='auto';a.volume=vol;pool.push(a);}
  SND[name]={pool,i:0,vol,src};
}
loadSfx('shoot','assets/audio/sfx/shoot.wav',0.10,6);   // heavily attenuated — the player's own gun should never fatigue
loadSfx('laser','assets/audio/sfx/laser.wav',0.20,4);
loadSfx('enemyshot','assets/audio/sfx/enemyshot.wav',0.13,5);
loadSfx('explode','assets/audio/sfx/explode.wav',0.5,6);
loadSfx('explode_big','assets/audio/sfx/explode_big.wav',0.7,3);
loadSfx('hit','assets/audio/sfx/hit.wav',0.35,6);
loadSfx('playerhit','assets/audio/sfx/playerhit.wav',0.8,2);
loadSfx('pickup','assets/audio/sfx/pickup.wav',0.6,3);
loadSfx('powerup','assets/audio/sfx/powerup.wav',0.7,3);
loadSfx('bomb','assets/audio/sfx/bomb.wav',0.8,2);
loadSfx('confirm','assets/audio/ui/confirm.ogg',0.6,2);
loadSfx('deny','assets/audio/ui/deny.ogg',0.6,2);
loadSfx('complete','assets/audio/ui/complete.ogg',0.7,1);
loadSfx('select','assets/audio/ui/select.ogg',0.5,3);

let AC=null; // WebAudio for synth fallback
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function synthBeep(freq=440,dur=0.08,type='square',vol=0.2){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
  g.gain.value=vol*AUDIO.sfxVol; g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  o.start(); o.stop(c.currentTime+dur);
}
// The main gun HAS a voice again (a game called Blast Everything shouldn't be silent) — but a soft, warm, pitch-varied blip, hard-throttled so it's a rhythmic tap, never the old fatiguing drone.
let _gunLast=-99;
function gunPulse(){ if(AUDIO.muted||!AUDIO.unlocked||G.frame-_gunLast<6) return; _gunLast=G.frame;
  const c=ac(); if(!c){ return; }
  const o=c.createOscillator(), g=c.createGain(); o.type='triangle';
  o.frequency.setValueAtTime(210+rand(0,70),c.currentTime); o.frequency.exponentialRampToValueAtTime(120,c.currentTime+0.05);   // quick downward "tup"
  o.connect(g); g.connect(c.destination);
  g.gain.value=0.05*AUDIO.sfxVol; g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.055);
  o.start(); o.stop(c.currentTime+0.06);
}
// Rapid-fire sounds are rate-limited so they never stack into a harsh drone (min frames between plays)
const SFX_THROTTLE={shoot:9, laser:10, enemyshot:4};
const sfxLast={};
let _mainGunMute=false;   // true only while the player's auto-fire MAIN GUN fires — silences its constant shoot/laser sound (every other SFX is unaffected)
function sfx(name,vol=1,rate=1){
  if(AUDIO.muted||!AUDIO.unlocked) return;
  if(_mainGunMute&&(name==='shoot'||name==='laser')) return;   // no constant main-gun drone (missiles / enemy beams / stolen-ammo etc. keep their sounds)
  const th=SFX_THROTTLE[name];
  if(th){ if((G.frame-(sfxLast[name]||-1e9))<th) return; sfxLast[name]=G.frame; }
  const s=SND[name];
  if(!s){ return; }
  const a=s.pool[s.i]; s.i=(s.i+1)%s.pool.length;
  // if the file failed to load, fall back to a synth blip for shots
  if(a.error||(a.readyState===0&&a.networkState===3)){
    if(name==='shoot') synthBeep(440+rand(0,120),0.04,'triangle',0.05);
    else if(name==='laser') synthBeep(900,0.07,'sawtooth',0.09);
    else if(name.startsWith('explode')) synthBeep(90,0.25,'triangle',0.3);
    return;
  }
  try{a.currentTime=0;}catch(e){}
  a.volume=clamp(s.vol*vol*AUDIO.sfxVol*2,0,1);
  a.playbackRate=clamp(rate,0.5,2.5);
  const p=a.play(); if(p&&p.catch) p.catch(()=>{});
}
// music
const musicEl=new Audio(); musicEl.loop=true;
let curTrack=null, pendingTrack=null;
function music(name){
  const src='assets/audio/music/'+name+'.ogg';
  if(curTrack===src) return;
  curTrack=src;
  if(AUDIO.muted||!AUDIO.unlocked){ pendingTrack=src; return; }
  musicEl.src=src; musicEl.volume=AUDIO.musicVol;
  const p=musicEl.play(); if(p&&p.catch) p.catch(()=>{ pendingTrack=src; });
}
// Idempotent + retrying: never poisons state. Called from real gestures (keydown,
// pointerdown) AND best-effort from the gamepad poll. Each call resumes a suspended
// AudioContext and (re)starts the wanted music if it isn't already playing, so if the
// first attempt is blocked by the autoplay policy a later genuine gesture recovers audio.
function unlockAudio(){
  AUDIO.unlocked=true;
  const c=ac(); if(c&&c.state==='suspended') c.resume().catch(()=>{});
  if(AUDIO.muted) return;
  const want=pendingTrack||curTrack;
  if(want&&musicEl.paused){
    if(musicEl.src.indexOf(want)<0){ musicEl.src=want; }
    musicEl.volume=AUDIO.musicVol;
    musicEl.play().then(()=>{pendingTrack=null;}).catch(()=>{});
  }
}
// push saved OPTIONS into the audio mix (called at boot and on every OPTIONS change)
function applyOpts(){ AUDIO.musicVol=OPT.music; AUDIO.sfxVol=OPT.sfx; musicEl.volume=clamp(AUDIO.musicVol,0,1); }
function toggleMute(){
  AUDIO.muted=!AUDIO.muted;
  if(AUDIO.muted){ musicEl.pause(); }
  else { AUDIO.unlocked=true; if(curTrack){musicEl.src=curTrack;musicEl.volume=AUDIO.musicVol;musicEl.play().catch(()=>{});} }
}

/* ---------- input ---------- */
const keys=Object.create(null), pressed=Object.create(null);
// LAST-USED INPUT DEVICE - every on-screen hint names only the buttons of the device you're actually holding
const INPUT={dev:'kb'};   // 'kb' (keyboard/mouse) · 'pad' · 'touch'
const hk=(kb,pad,touch)=>INPUT.dev==='pad'?pad:INPUT.dev==='touch'?(touch??kb):kb;
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!keys[k]) pressed[k]=true;
  keys[k]=true; unlockAudio(); INPUT.dev='kb';
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
let pointer={active:false,x:W/2,y:H*0.8};
// ---- POINTER + TOUCH (multi-touch): one pointer steers the ship (drag), the others press on-screen buttons ----
// TOUCH.on flips the first time a finger/pen touches the canvas, which shows the button overlay in play.
const TOUCH={on:false,move:null,hold:{},btnOf:{}};
function toLogical(e){const r=CV.getBoundingClientRect();return {x:clamp((e.clientX-r.left)/r.width*W,0,W),y:clamp((e.clientY-r.top)/r.height*H,0,H)};}
const inPlay=()=>(G.mode==='play'||G.mode==='boss')&&!G.paused;
function touchButtons(){   // on-screen buttons (logical coords). hold:true = held like a key; press = one-shot `pressed` key
  const B=[
    {id:'focus',  label:'FOCUS', x:W-40, y:H-206,r:25,hold:true},
    {id:'missile',label:'MISSILE',x:W-40,y:H-144,r:25,hold:true,count:()=>player.missiles},
    {id:'bomb',   label:'BOMB',  x:W-40, y:H-80, r:28,press:'bomb',count:()=>G.bombs},
    {id:'drone',  label:'DRONE', x:W-104,y:H-80, r:21,press:'togglepod'},
    {id:'stance', label:'STANCE',x:W-104,y:H-136,r:19,press:'podstance'},
    {id:'pause',  label:'II',    x:36,   y:H-104,r:19,press:'p'},
  ];
  if(player.pendingLevels>0)B.push({id:'level',label:'LVL UP',x:36,y:H-160,r:25,press:'activate',count:()=>player.pendingLevels});
  return B;
}
// touch BACK on menus — the touch stand-in for B / X wherever those go back, decline or give up
const TOUCH_BACK={x:8,y:40,w:104,h:30};
function touchBackLabel(){
  if(G.paused)return G.pauseView!=='menu'?'◀ BACK':null;
  switch(G.mode){
    case 'saveselect':case 'stagepick':case 'difficulty':case 'shipselect':case 'credits':return '◀ BACK';
    case 'over':return hasCheckpoint()?'◀ GIVE UP':null;
    case 'win':return G.canLoop2?'◀ END RUN':null;
  } return null;
}
function drawTouchBack(){ const l=TOUCH.on&&touchBackLabel(); if(!l)return; const r=TOUCH_BACK;
  CX.save();CX.fillStyle='rgba(10,20,32,0.85)';CX.strokeStyle=l==='◀ BACK'?'#3df0ff':'#ff6a8a';CX.lineWidth=1.5;roundRect(r.x,r.y,r.w,r.h,6);CX.fill();CX.stroke();
  CX.fillStyle='#eaffff';CX.font="bold 12px 'Courier New',monospace";CX.textAlign='center';CX.fillText(l,r.x+r.w/2,r.y+19);CX.restore(); }
function touchButtonAt(x,y){ if(!TOUCH.on||!inPlay())return null; for(const b of touchButtons())if(dist2(x,y,b.x,b.y)<(b.r+8)**2)return b; return null; }
CV.addEventListener('pointerdown',e=>{ unlockAudio(); if(e.pointerType==='touch'||e.pointerType==='pen')TOUCH.on=true; INPUT.dev=(e.pointerType==='touch'||e.pointerType==='pen')?'touch':'kb';
  const p=toLogical(e), b=touchButtonAt(p.x,p.y);
  if(TOUCH.on&&touchBackLabel()){const r=TOUCH_BACK;if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){pressed['bomb']=true;return;}}   // touch BACK = B / X (no tap-confirm)
  if(b){ TOUCH.btnOf[e.pointerId]=b.id; if(b.hold)TOUCH.hold[b.id]=true; else pressed[b.press]=true; rumble(0.1,0.15,30); return; }
  if(TOUCH.move==null){TOUCH.move=e.pointerId;pointer.active=true;pointer.x=p.x;pointer.y=p.y;}
  else if(!inPlay()){pointer.x=p.x;pointer.y=p.y;}   // menus: every tap lands where it was made; in play a 2nd finger never yanks the ship
  justTapped=true;setTimeout(()=>justTapped=false,60);
});
addEventListener('pointermove',e=>{if(e.pointerId===TOUCH.move){const p=toLogical(e);pointer.x=p.x;pointer.y=p.y;}});
function releasePointer(e){const id=TOUCH.btnOf[e.pointerId];if(id){delete TOUCH.hold[id];delete TOUCH.btnOf[e.pointerId];}
  if(e.pointerId===TOUCH.move){TOUCH.move=null;pointer.active=false;}}
addEventListener('pointerup',releasePointer); addEventListener('pointercancel',releasePointer);
CV.addEventListener('dblclick',()=>{if(!TOUCH.on&&inPlay())pressed['togglepod']=true;});   // mouse double-click = drone (touch has its own button)
function drawTouchButtons(){
  CX.save();CX.textAlign='center';
  for(const b of touchButtons()){const held=!!TOUCH.hold[b.id];
    CX.globalAlpha=held?0.55:0.3;CX.fillStyle=held?'#3df0ff':'#0c1a2a';CX.beginPath();CX.arc(b.x,b.y,b.r,0,TAU);CX.fill();
    CX.globalAlpha=held?0.95:0.6;CX.strokeStyle=b.id==='level'?'#7dffb0':'#3df0ff';CX.lineWidth=2;CX.stroke();
    CX.globalAlpha=0.9;CX.fillStyle='#eaffff';CX.font="bold "+(b.label.length>5?8:10)+"px 'Courier New',monospace";CX.fillText(b.label,b.x,b.y+(b.count?-1:3));
    if(b.count){CX.fillStyle='#ffd166';CX.font="bold 10px 'Courier New',monospace";CX.fillText(String(b.count()),b.x,b.y+12);}}
  CX.restore();
}
let justTapped=false;

/* ---------- gamepad (full controller support, Standard mapping) ----------
   Left stick / D-pad = move (analog, variable speed) · A = confirm / level-up ·
   B = bomb / back · X = drone dock/deploy · Y or Back = mute · LB/LT (held) =
   focus · RB/RT (held) = missile · R3 = drone stance · Start = pause / confirm. Edge-detected so held
   buttons fire once in menus; feeds the existing keyboard `pressed`/`keys` model. */
const GP={connected:false,mx:0,my:0,focus:0,missile:0,prev:[],navT:0,anyBtn:false};
const GP_DEAD=0.26;
addEventListener('gamepadconnected',()=>{GP.connected=true;INPUT.dev='pad';});
addEventListener('gamepaddisconnected',()=>{
  try{GP.connected=[...(navigator.getGamepads?navigator.getGamepads():[])].some(g=>g);}catch(e){GP.connected=false;}});
function firstPad(){
  let pads=[]; try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){return null;}
  for(const p of (pads||[])) if(p&&p.connected!==false) return p;
  return null;
}
// controller RUMBLE (Gamepad API vibrationActuator — Chrome/Edge/Safari; feature-detected, silent no-op elsewhere or when OPT.rumble is off)
function rumble(strong,weak,ms){ if(!OPT.rumble)return; const gp=firstPad(), a=gp&&gp.vibrationActuator; if(!a||!a.playEffect)return;
  try{ const p=a.playEffect('dual-rumble',{startDelay:0,duration:ms,strongMagnitude:strong,weakMagnitude:weak}); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }
// AUTO-PAUSE when the window loses focus or the tab hides, and drop held keys so nothing stays stuck down on return
function autoPause(){ if(window.BEST_TEST)return; for(const k in keys)keys[k]=false;
  TOUCH.hold={};TOUCH.btnOf={};TOUCH.move=null;pointer.active=false;   // a phone switching apps mid-hold may never send pointerup
  if((G.mode==='play'||G.mode==='boss')&&!G.paused){G.paused=true;G.pauseSel=0;G.pauseView='menu';}
  else if(G.mode==='shift')G.pauseAfterShift=true; }   // mid stage-change: pause the moment play resumes
addEventListener('blur',autoPause);
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause();});
function pollGamepad(){
  GP.mx=0;GP.my=0;GP.focus=0;GP.missile=0;GP.anyBtn=false;   // reset every frame so a pad unplugged mid-hold can't leave missiles auto-firing
  if(TOUCH.hold.focus)GP.focus=1; if(TOUCH.hold.missile)GP.missile=1;   // on-screen hold buttons feed the same channels as LB / RB
  const gp=firstPad();
  if(!gp){ return; }
  GP.connected=true;
  const btn=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
  const bval=i=>gp.buttons[i]?gp.buttons[i].value:0;
  // movement: left stick (deadzone + rescale) with D-pad override
  const dz=v=>{v=v||0;const a=Math.abs(v);return a<GP_DEAD?0:Math.sign(v)*(a-GP_DEAD)/(1-GP_DEAD);};
  let ax=dz(gp.axes[0]), ay=dz(gp.axes[1]);
  if(btn(14))ax=-1; if(btn(15))ax=1; if(btn(12))ay=-1; if(btn(13))ay=1;
  GP.mx=clamp(ax,-1,1); GP.my=clamp(ay,-1,1);
  // focus: any shoulder button or trigger held
  GP.focus=(GP.focus||btn(4)||btn(6)||bval(6)>0.45)?1:0;      // LB / LT = focus (OR'd with the touch button)
  GP.missile=(GP.missile||btn(5)||btn(7)||bval(7)>0.45)?1:0;  // RB / RT = explosive missile
  // edge detection (keep prev in sync for every button we test)
  const edge=i=>{const p=btn(i),was=GP.prev[i];GP.prev[i]=p;return p&&!was;};
  const eA=edge(0),eB=edge(1),eX=edge(2),eY=edge(3),eLB=edge(4),eRB=edge(5),eBack=edge(8),eStart=edge(9),eR3=edge(11);
  if(eA){pressed['enter']=true;pressed['activate']=true;}         // confirm / activate power
  if(eStart){pressed['enter']=true;pressed['p']=true;}            // confirm / pause
  if(eB)pressed['bomb']=true;
  if(eX)pressed['togglepod']=true;
  if(eR3)pressed['podstance']=true;   // right-stick click cycles pod stance
  if(eY||eBack)pressed['m']=true;
  // menu navigation via stick/D-pad — wall-clock repeat (refresh-rate independent, menus only)
  if(G.mode==='saveselect'||G.mode==='stagepick'||G.mode==='difficulty'||G.mode==='shipselect'||G.mode==='draft'||G.mode==='shop'||G.paused){
    const up=btn(12)||GP.my<-0.5, dn=btn(13)||GP.my>0.5, lf=btn(14)||GP.mx<-0.5, rt=btn(15)||GP.mx>0.5;
    if(up||dn||lf||rt){ if(now()-GP.navT>170){ if(up)pressed['arrowup']=true; if(dn)pressed['arrowdown']=true; if(lf)pressed['arrowleft']=true; if(rt)pressed['arrowright']=true; GP.navT=now(); } }
    else GP.navT=0;
  } else GP.navT=0;
  if(eA||eB||eX||eY||eLB||eRB||eBack||eStart){GP.anyBtn=true;unlockAudio();}
  if(GP.anyBtn||Math.abs(ax)>0.5||Math.abs(ay)>0.5||btn(4)||btn(5)||btn(6)||btn(7))INPUT.dev='pad';
}

function burst(x,y,color,n=10,spd=3,life=30,size=2.2,g=0){
  for(let i=0;i<n;i++){const a=rand(TAU),s=rand(spd*0.3,spd);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,color,size:rand(size*0.5,size),g});}
}
function spark(x,y,color,dir,n=6){
  for(let i=0;i<n;i++){const a=dir+rand(-0.6,0.6),s=rand(1,4);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:18,max:18,color,size:rand(1,2.4),g:0});}
}
function ring(x,y,color,r0=4,r1=40,life=22,lw=2){parts.push({ring:true,x,y,r:r0,r1,life,max:life,color,lw});}
// "ray-traced" light shards radiating from a bright event (explosions, boss death, the perspective shift)
function rayBurst(x,y,color,n=8,life=22,len=70){
  for(let i=0;i<n;i++){const a=i/n*TAU+rand(-0.25,0.25);
    parts.push({ray:true,x,y,ang:a,len:len*rand(0.65,1.35),life,max:life,color,lw:rand(3,7)});}
  parts.push({ring:true,x,y,r:2,r1:len*0.7,life:Math.round(life*0.6),max:Math.round(life*0.6),color:'#ffffff',lw:3});   // bright bloom flash
}
// ---- ELECTRICITY: forking Tesla-web lightning (midpoint-displacement path + recursive branches) ----
function jaggedPath(x1,y1,x2,y2,detail,jag){
  let pts=[[x1,y1],[x2,y2]];
  for(let d=0;d<detail;d++){const np=[];
    for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];
      const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,nx=-(b[1]-a[1]),ny=(b[0]-a[0]),nl=Math.hypot(nx,ny)||1,off=rand(-jag,jag)/(d+1);
      np.push(a,[mx+nx/nl*off,my+ny/nl*off]);}
    np.push(pts[pts.length-1]);pts=np;}
  return pts;
}
function webBolt(x1,y1,x2,y2,color,gen,w){   // a jagged arc + recursive forks → reads as branching electricity
  gen=gen==null?2:gen; w=w||2.4;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  parts.push({bolt:true,pts:jaggedPath(x1,y1,x2,y2,len>120?5:4,Math.min(16,len*0.14)),life:9+rand(0,4),max:13,color,w});
  if(gen>0){const base=Math.atan2(dy,dx),nf=1+(gen>=2?1:0);
    for(let f=0;f<nf;f++){const t=rand(0.25,0.72),bx=lerp(x1,x2,t),by=lerp(y1,y2,t),
      ang=base+(f%2?1:-1)*rand(0.4,0.95),fl=len*rand(0.22,0.5);
      webBolt(bx,by,bx+Math.cos(ang)*fl,by+Math.sin(ang)*fl,color,gen-1,w*0.6);}}
}
// volumetric light shaft (ray-traced-style beam), used by explosions/boss-death and the redesigned UI
function lightShaft(x,y,ang,len,wid,color,life){parts.push({shaft:true,x,y,ang,len,wid,life:life||20,max:life||20,color});}
function debris(x,y,color,n=6){
  for(let i=0;i<n;i++){const a=rand(TAU),s=rand(1,3.5);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(30,55),max:55,color,size:rand(1.5,3),g:0.04,spin:rand(-0.3,0.3),rot:rand(TAU),box:true});}
}
function floatText(x,y,txt,color='#fff',size=12){floaters.push({x,y,txt,color,size,life:52,max:52,vy:-0.5});}
function shake(amount){G.trauma=clamp(G.trauma+amount,0,1);}

function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    if(p.ray||p.bolt||p.shaft){p.life-=dt;if(p.life<=0)parts.splice(i,1);continue;}   // light shards / lightning / shafts stay put and fade
    if(p.ring){p.life-=dt;p.r=lerp(p.r,p.r1,0.18);if(p.life<=0)parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.vx*=0.94;p.vy*=0.94;
    if(p.box)p.rot+=p.spin*dt; p.life-=dt;
    if(p.life<=0)parts.splice(i,1);}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.y+=f.vy*dt;f.life-=dt;if(f.life<=0)floaters.splice(i,1);}
}
function drawParticles(){
  CX.globalCompositeOperation='lighter';
  for(const p of parts){const a=clamp(p.life/p.max,0,1);
    if(p.ray){const ln=p.len*(1.35-a*0.35),w=p.lw*a;   // tapered light-beam shard (bright-to-transparent)
      CX.globalAlpha=a*0.75;CX.save();CX.translate(p.x,p.y);CX.rotate(p.ang);CX.fillStyle=p.color;
      CX.beginPath();CX.moveTo(0,-w);CX.lineTo(ln,0);CX.lineTo(0,w);CX.closePath();CX.fill();CX.restore();}
    else if(p.bolt){CX.lineCap='round';CX.lineJoin='round';   // webbing lightning: fat colored glow + white-hot core
      CX.globalAlpha=a*0.85;CX.strokeStyle=p.color;CX.lineWidth=p.w*(0.6+a*0.6)+2;
      CX.beginPath();CX.moveTo(p.pts[0][0],p.pts[0][1]);for(let i=1;i<p.pts.length;i++)CX.lineTo(p.pts[i][0],p.pts[i][1]);CX.stroke();
      CX.globalAlpha=a;CX.strokeStyle='#eaffff';CX.lineWidth=Math.max(0.6,p.w*a*0.5);CX.stroke();}
    else if(p.shaft){CX.save();CX.translate(p.x,p.y);CX.rotate(p.ang);   // volumetric ray-of-light shaft
      const g=CX.createLinearGradient(0,0,p.len,0);g.addColorStop(0,p.color);g.addColorStop(1,'rgba(0,0,0,0)');
      CX.globalAlpha=a*0.5;CX.fillStyle=g;CX.beginPath();CX.moveTo(0,-p.wid);CX.lineTo(p.len,-p.wid*0.14);CX.lineTo(p.len,p.wid*0.14);CX.lineTo(0,p.wid);CX.closePath();CX.fill();CX.restore();}
    else if(p.ring){CX.globalAlpha=a;CX.strokeStyle=p.color;CX.lineWidth=p.lw||2;CX.beginPath();CX.arc(p.x,p.y,p.r,0,TAU);CX.stroke();}
    else if(p.box){CX.globalAlpha=a;CX.save();CX.translate(p.x,p.y);CX.rotate(p.rot);CX.fillStyle=p.color;CX.fillRect(-p.size,-p.size,p.size*2,p.size*2);CX.restore();}
    else{CX.globalAlpha=a;CX.fillStyle=p.color;CX.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}}
  CX.globalCompositeOperation='source-over';CX.globalAlpha=1;
  for(const f of floaters){CX.globalAlpha=clamp(f.life/f.max*1.4,0,1);CX.font=`bold ${f.size}px 'Courier New',monospace`;CX.textAlign='center';
    CX.fillStyle='#000';CX.fillText(f.txt,f.x+1,f.y+1);CX.fillStyle=f.color;CX.fillText(f.txt,f.x,f.y);}
  CX.globalAlpha=1;CX.textAlign='left';
}

function curStage(){const n=STAGES.length;return STAGES[(((G.stage-1)%n)+n)%n];}   // robust for G.stage=0 during loop transition
function drawBackground(dt){

    if(G.orient==='vertical')nb.y+=0.09*dt; else nb.x-=0.09*dt;
    if(nb.y>H+nb.r)nb.y=-nb.r; if(nb.x<-nb.r)nb.x=W+nb.r;
    const hue=(curStage().hue!=null?curStage().hue:190);
    const g=CX.createRadialGradient(nb.x,nb.y,0,nb.x,nb.y,nb.r);
    g.addColorStop(0,`hsla(${hue},80%,55%,${nb.a})`);g.addColorStop(1,'hsla(0,0%,0%,0)');
    CX.fillStyle=g;CX.beginPath();CX.arc(nb.x,nb.y,nb.r,0,TAU);CX.fill();}
  for(const s of stars){const spd=(0.6+s.z*2.6);
    if(G.orient==='vertical'){s.y+=spd*dt;if(s.y>H){s.y=0;s.x=rand(W);}}
    else{s.x-=spd*dt;if(s.x<0){s.x=W;s.y=rand(H);}}
    CX.globalAlpha=0.3+s.z*0.7;CX.fillStyle=s.c;CX.fillRect(s.x|0,s.y|0,s.z<0.5?1:2,s.z<0.5?1:2);}
  CX.globalAlpha=1;
  const bg=curStage().bg;
  if(bg==='factory')drawFactory(dt); else if(bg==='city')drawCity(dt); else if(bg==='spire')drawNullspire(dt);
  else if(bg==='asteroid')drawAsteroid(dt); else if(bg==='hive')drawHive(dt); else if(bg==='cryo')drawCryo(dt); else if(bg==='forge')drawForge(dt);
  else if(bg==='void')drawVoid(dt); else if(bg==='grid')drawGrid(dt); else if(bg==='storm')drawStorm(dt); else if(bg==='ruins')drawRuins(dt);
}

/* ---------- per-stage decor (kept dim: bullets stay the brightest thing) ---------- */
const decor={city:[],glyphs:[],rocks:[],blobs:[],shards:[],embers:[],orbs:[],clouds:[],pillars:[]};
function initStageDecor(){
  for(const k in decor)decor[k].length=0;
  const bg=curStage().bg;
  if(bg==='city'){for(let L=0;L<2;L++)for(let i=0;i<8;i++){
      const w=rand(28,64),h=rand(50,150)*(L?1.2:0.75),win=[];
      for(let k=0,n=randi(3,9);k<n;k++)win.push([rand(4,Math.max(5,w-6)),rand(6,Math.max(8,h-8))]);
      decor.city.push({x:rand(W),y:rand(-H,H),w,h,layer:L,win});}}
  if(bg==='spire'){for(let i=0;i<9;i++)decor.glyphs.push({x:rand(W),y:rand(H),s:rand(0.5,1.4),g:String.fromCharCode(0x16A0+randi(0,32)),a:rand(0.08,0.2)});}
  if(bg==='asteroid'){for(let i=0;i<11;i++)decor.rocks.push({x:rand(W),y:rand(H),r:rand(10,40),z:rand(0.3,1),rot:rand(TAU),spin:rand(-0.02,0.02),v:rand(4,7)});}
  if(bg==='hive'){for(let i=0;i<10;i++)decor.blobs.push({x:rand(W),y:rand(H),r:rand(20,60),a:rand(0.05,0.13),ph:rand(TAU)});}
  if(bg==='cryo'){for(let i=0;i<14;i++)decor.shards.push({x:rand(W),y:rand(H),len:rand(14,42),z:rand(0.3,1),a:rand(0.1,0.25)});}
  if(bg==='forge'){for(let i=0;i<26;i++)decor.embers.push({x:rand(W),y:rand(H),r:rand(1,3),v:rand(1.5,4)});}
  if(bg==='void'){for(let i=0;i<2;i++)decor.orbs.push({x:rand(W),y:rand(H),r:rand(90,175),v:rand(0.12,0.4),h:(curStage().hue||250)+rand(-18,18)});}
  if(bg==='storm'){for(let i=0;i<8;i++)decor.clouds.push({x:rand(W),y:rand(H),r:rand(60,150),a:rand(0.06,0.16),v:rand(0.25,0.8)});}
  if(bg==='ruins'){for(let i=0;i<9;i++)decor.pillars.push({x:rand(W),y:rand(-H,H),w:rand(16,32),h:rand(80,230),layer:randi(0,2),v:rand(0.35,1.1)});}
}
function drawAsteroid(dt){ // drifting rocks (parallax) — scroll with orientation
  for(const r of decor.rocks){const sp=r.v*r.z;
    if(G.orient==='vertical'){r.y+=sp*dt;if(r.y-r.r>H){r.y=-r.r;r.x=rand(W);}}else{r.x-=sp*dt;if(r.x+r.r<0){r.x=W+r.r;r.y=rand(H);}}
    r.rot+=r.spin*dt;CX.save();CX.translate(r.x,r.y);CX.rotate(r.rot);
    CX.fillStyle=`rgba(90,74,58,${0.25+r.z*0.35})`;CX.strokeStyle='rgba(150,120,90,0.3)';CX.lineWidth=1;
    CX.beginPath();for(let i=0;i<7;i++){const a=i/7*TAU,rr=r.r*(0.75+((i*37)%10)/20);CX.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}CX.closePath();CX.fill();CX.stroke();CX.restore();}
}
function drawHive(dt){ // pulsing organic membrane
  for(const b of decor.blobs){if(G.orient==='vertical')b.y+=0.3*dt;else b.x-=0.3*dt;
    if(b.y>H+b.r)b.y=-b.r; if(b.x<-b.r)b.x=W+b.r;
    const pr=b.r*(1+0.12*Math.sin(G.t*0.04+b.ph));const g=CX.createRadialGradient(b.x,b.y,0,b.x,b.y,pr);
    g.addColorStop(0,`hsla(140,70%,45%,${b.a})`);g.addColorStop(0.7,`hsla(150,60%,30%,${b.a*0.6})`);g.addColorStop(1,'rgba(0,0,0,0)');
    CX.fillStyle=g;CX.beginPath();CX.arc(b.x,b.y,pr,0,TAU);CX.fill();}
}
function drawCryo(dt){ // ice shards / crystal fog
  for(const s of decor.shards){const sp=(0.6+s.z*2.2);
    if(G.orient==='vertical'){s.y+=sp*dt;if(s.y>H+s.len)s.y=-s.len;}else{s.x-=sp*dt;if(s.x<-s.len)s.x=W+s.len;}
    CX.strokeStyle=`rgba(160,220,255,${s.a})`;CX.lineWidth=1+s.z;CX.beginPath();
    if(G.orient==='vertical'){CX.moveTo(s.x,s.y);CX.lineTo(s.x+s.len*0.3,s.y+s.len);}else{CX.moveTo(s.x,s.y);CX.lineTo(s.x-s.len,s.y+s.len*0.3);}CX.stroke();}
}
function drawForge(dt){ // rising embers + heat glow
  CX.globalCompositeOperation='lighter';
  for(const e of decor.embers){if(G.orient==='vertical')e.y+=e.v*0.3*dt;else e.x-=e.v*dt;e.y-=e.v*0.4*dt;
    if(e.y<-4){e.y=H+4;e.x=rand(W);} if(e.x<-4){e.x=W+4;e.y=rand(H);}
    CX.globalAlpha=0.5;CX.fillStyle=rand()<0.5?'#ff6a3d':'#ffb14d';CX.fillRect(e.x,e.y,e.r,e.r);}
  CX.globalAlpha=1;CX.globalCompositeOperation='source-over';
}
function drawFactory(dt){ // horizontal corridor: steel walls, girders, hazard stripes
  const bh=54, off=(G.t*2.4)%36;
  CX.fillStyle='#0b0f18';CX.fillRect(0,0,W,bh);CX.fillRect(0,H-bh,W,bh);
  CX.strokeStyle='#1c2637';CX.lineWidth=3;CX.beginPath();
  for(let x=-36;x<W+36;x+=36){CX.moveTo(x-off,4);CX.lineTo(x-off+24,bh-6);CX.moveTo(x-off,H-4);CX.lineTo(x-off+24,H-bh+6);}
  CX.stroke();
  CX.fillStyle='#141a26';CX.fillRect(0,bh-6,W,6);CX.fillRect(0,H-bh,W,6);
  CX.fillStyle='#3a2f10';
  for(let x=-24;x<W+24;x+=24){const xx=x-off;CX.fillRect(xx,bh-6,12,6);CX.fillRect(xx+12,H-bh,12,6);}
  CX.fillStyle='rgba(61,240,255,0.25)';
  for(let x=-96;x<W+96;x+=96){const xx=x-(G.t*0.8)%96;CX.fillRect(xx,bh-10,4,3);CX.fillRect(xx+40,H-bh+7,4,3);}
}
function drawCity(dt){ // vertical flyover: buildings with lit windows scroll past below
  for(const b of decor.city){
    b.y+=(b.layer?0.5:0.25)*dt;
    if(b.y-b.h>H){b.y=-rand(20,120);b.x=rand(W);}
    CX.fillStyle=b.layer?'#0d1322':'#080d18';
    CX.fillRect(b.x-b.w/2,b.y-b.h,b.w,b.h);
    CX.fillStyle=b.layer?'rgba(255,209,102,0.30)':'rgba(127,216,255,0.18)';
    for(const w of b.win)CX.fillRect(b.x-b.w/2+w[0],b.y-b.h+w[1],2,3);
  }
}
function drawNullspire(dt){ // looming spire silhouette on the right + drifting runes
  const sx=W*0.84+Math.sin(G.t*0.004)*5;
  const g=CX.createLinearGradient(0,H*0.1,0,H);
  g.addColorStop(0,'rgba(46,30,66,0.5)');g.addColorStop(1,'rgba(8,6,16,0.92)');
  CX.fillStyle=g;
  CX.beginPath();CX.moveTo(sx-54,H);CX.lineTo(sx-14,H*0.24);CX.lineTo(sx,H*0.1);CX.lineTo(sx+14,H*0.24);CX.lineTo(sx+54,H);CX.closePath();CX.fill();
  // faint glow along the two slopes (NOT a lone center line)
  CX.strokeStyle='rgba(199,125,255,0.16)';CX.lineWidth=2;
  CX.beginPath();CX.moveTo(sx,H*0.1);CX.lineTo(sx-54,H);CX.moveTo(sx,H*0.1);CX.lineTo(sx+54,H);CX.stroke();
  // staggered rune-lights (offset so they don't form a straight column)
  CX.fillStyle='rgba(199,125,255,0.28)';
  for(let i=1;i<7;i++){const yy=H*0.1+(H*0.9)*(i/7),ox=Math.sin(i*1.7)*11;CX.fillRect(sx+ox-1,yy,3,3);}
  for(const gl of decor.glyphs){
    gl.x-=gl.s*0.5*dt; if(gl.x<-16){gl.x=W+16;gl.y=rand(H);}
    CX.globalAlpha=gl.a*(0.7+0.3*Math.sin(G.t*0.05+gl.y));CX.fillStyle='#c77dff';
    CX.font=((10*gl.s)|0)+'px monospace';CX.fillText(gl.g,gl.x,gl.y);}
  CX.globalAlpha=1;
  if(G.frame%240<5){CX.globalAlpha=0.05;CX.fillStyle='#c77dff';CX.fillRect(0,0,W,H);CX.globalAlpha=1;}
}
function drawVoid(dt){ // deep space: slow giant planets drifting past
  for(const o of decor.orbs){
    if(G.orient==='vertical'){o.y+=o.v*dt;if(o.y-o.r>H){o.y=-o.r;o.x=rand(W);}}else{o.x-=o.v*dt;if(o.x+o.r<0){o.x=W+o.r;o.y=rand(H);}}
    const g=CX.createRadialGradient(o.x-o.r*0.3,o.y-o.r*0.3,o.r*0.1,o.x,o.y,o.r);
    g.addColorStop(0,`hsla(${o.h},70%,60%,0.20)`);g.addColorStop(0.65,`hsla(${o.h},70%,32%,0.13)`);g.addColorStop(1,'hsla(0,0%,0%,0)');
    CX.fillStyle=g;CX.beginPath();CX.arc(o.x,o.y,o.r,0,TAU);CX.fill();
    CX.strokeStyle=`hsla(${o.h},70%,72%,0.13)`;CX.lineWidth=2;CX.beginPath();CX.arc(o.x,o.y,o.r*0.72,0,TAU);CX.stroke();
  }
}
function drawGrid(dt){ // scrolling neon cyber-grid + a sweeping pulse line
  const hue=curStage().hue||170,vert=G.orient==='vertical',gap=46,off=(G.t*0.9)%gap;
  CX.save();CX.globalCompositeOperation='lighter';CX.lineWidth=1;
  CX.strokeStyle=`hsla(${hue},80%,55%,0.10)`;CX.beginPath();
  for(let x=-gap;x<=W+gap;x+=gap){const xx=x+(vert?0:-off);CX.moveTo(xx,0);CX.lineTo(xx,H);}
  for(let y=-gap;y<=H+gap;y+=gap){const yy=y+(vert?off:0);CX.moveTo(0,yy);CX.lineTo(W,yy);}
  CX.stroke();
  CX.strokeStyle=`hsla(${hue},90%,66%,0.22)`;CX.beginPath();
  if(vert){const yy=(G.t*2.4)%H;CX.moveTo(0,yy);CX.lineTo(W,yy);}else{const xx=W-(G.t*2.4)%W;CX.moveTo(xx,0);CX.lineTo(xx,H);}
  CX.stroke();CX.restore();
}
function drawStorm(dt){ // dark storm clouds + occasional lightning
  const hue=curStage().hue||210;
  for(const c of decor.clouds){
    if(G.orient==='vertical'){c.y+=c.v*dt;if(c.y-c.r>H){c.y=-c.r;c.x=rand(W);}}else{c.x-=c.v*dt;if(c.x+c.r<0){c.x=W+c.r;c.y=rand(H);}}
    const g=CX.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r);
    g.addColorStop(0,`hsla(${hue},40%,32%,${c.a})`);g.addColorStop(1,'hsla(0,0%,0%,0)');
    CX.fillStyle=g;CX.beginPath();CX.arc(c.x,c.y,c.r,0,TAU);CX.fill();
  }
  if(G.frame%150<3){CX.save();CX.globalCompositeOperation='lighter';CX.strokeStyle='rgba(180,210,255,0.45)';CX.lineWidth=2;
    let x=rand(W*0.2,W*0.8),y=0;CX.beginPath();CX.moveTo(x,0);while(y<H){y+=rand(28,58);x+=rand(-28,28);CX.lineTo(x,y);}CX.stroke();CX.restore();}
}
function drawRuins(dt){ // silhouetted ancient columns drifting past
  const hue=curStage().hue||45;
  for(const p of decor.pillars){
    if(G.orient==='vertical'){p.y+=p.v*dt;if(p.y-p.h>H){p.y=-rand(20,140);p.x=rand(W);}}
    else{p.x-=p.v*dt;if(p.x+p.w<0){p.x=W+rand(20,140);p.y=rand(H);}}
    CX.fillStyle=`hsla(${hue},22%,${7+p.layer*6}%,0.9)`;
    CX.fillRect(p.x-p.w/2,p.y-p.h,p.w,p.h);
    CX.fillStyle=`hsla(${hue},55%,55%,0.12)`;CX.fillRect(p.x-p.w/2-2,p.y-p.h,p.w+4,4);   // lit capital
  }
}

/* =====================================================================

   ===================================================================== */
/* The Force Pod is a levelled companion (player.podLvl 1→6). It grows from a basic
   placeable auto-cannon into a fully-autonomous AI ally drone: faster fire, bullet
   shielding, auto-aim, a twin array, homing warheads + a damage aura, and finally
   self-navigation that hunts the nearest threat. All stats derive from podLvl. */
function ForcePod(){this.attached=true;this.x=player.x;this.y=player.y-24;this.fireCd=0;this.hum=0;this.blockR=0;this.aCd=0;this.mCd=0;}

ForcePod.prototype.nearest=function(){
  let best=null,bd=1e9;
  for(const e of enemies){if(e.enter)continue;const d=dist2(this.x,this.y,e.x,e.y);if(d<bd){bd=d;best=e;}}
  if(boss&&!boss.enter&&!boss.dead){const d=dist2(this.x,this.y,boss.x,boss.y);if(d<bd){bd=d;best=boss;}}
  return best;
};
ForcePod.prototype.aura=function(dt){   // Lv5+: sustained damage field around the pod

  for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(e.enter)continue;
    if(dist2(this.x,this.y,e.x,e.y)<(R+e.r)**2&&damageEnemy(e,bd))killEnemy(e,j);}
  if(boss&&!boss.dead&&!boss.enter&&dist2(this.x,this.y,boss.x,boss.y)<(R+boss.r)**2)damageBoss(bd);
};
ForcePod.prototype.warhead=function(dt){   // HUNTER: lobs homing micro-missiles — HUNTER CORE boosts rate/count/damage
  const hc=player.podCores.hunter;
  this.mCd-=dt; if(this.mCd>0)return;
  this.mCd=Math.max(18,(54-player.podLvl*4)*(1-hc*0.15));
  const n=hc>=3?3:hc>=2?2:1, dmg=this.podDmg()*1.3*(hc>=2?1.25:1)*(player.relics.omnipod?0.6:1);   // OMNI-DRONE runs all 3 stance abilities at once, so its offensive warheads are weaker — a dedicated HUNTER (esp. with a Hunter Core) out-damages it. Breadth vs depth, not a strict upgrade.
  for(let k=0;k<n;k++)pShots.push({x:this.x,y:this.y,vx:0,vy:0,r:3,dmg,color:'#e0b0ff',pod:true,homing:true,life:120});
  spark(this.x,this.y,'#e0b0ff',0);
};
ForcePod.prototype.toggle=function(){
  this.attached=!this.attached; sfx('confirm',0.7,this.attached?1.1:0.9);
  if(!this.attached){this.x=player.x+(G.orient==='vertical'?0:60);this.y=player.y+(G.orient==='vertical'?-60:0);}
  ring(this.x,this.y,'#b98bff',4,30,18); floatText(this.x,this.y-14,this.attached?'DOCK':'DEPLOY','#b98bff',10);
};
ForcePod.prototype.guardPulse=function(dt){   // GUARDIAN: nuke enemy bullets near the ship — GUARDIAN CORE makes it bigger/quicker, and at Lv3 also burns enemies
  const gc=player.podCores.guardian;
  this.gp=(this.gp||0)-dt; if(this.gp>0)return;
  const trig=32+gc*10; let close=false; for(const b of eShots){if(dist2(b.x,b.y,player.x,player.y)<trig*trig){close=true;break;}}

  if(gc>=3){const bd=pDmg(3+player.podLvl*0.6);   // maxed GUARDIAN CORE: the pulse also damages enemies in range
    for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(!e.enter&&dist2(player.x,player.y,e.x,e.y)<R*R&&damageEnemy(e,bd))killEnemy(e,j);}

ForcePod.prototype.forage=function(dt){   // FORAGER: vacuum pickups to the ship + repair — FORAGER CORE widens reach, speeds & deepens repair
  const fc=player.podCores.forager, R=fc>=3?9999:72+fc*30;   // maxed core = screen-wide magnet

};
ForcePod.prototype.update=function(dt){
  this.hum+=dt;
  const L=player.podLvl, st=player.podStance||0;
  this.blockR=(L>=2?10+L:0)*((st===1||player.relics.omnipod)?(1.7+player.podCores.guardian*0.15):1);   // GUARDIAN (or OMNI-POD) shields a wider area (GUARDIAN CORE widens it further)
  // ---- movement ----
  if(this.attached){const tx=player.x+(G.orient==='vertical'?0:24),ty=player.y+(G.orient==='vertical'?-24:0);
    this.x=lerp(this.x,tx,0.35);this.y=lerp(this.y,ty,0.35);}
  else if(L>=6){   // AI ALLY (Lv6): hangs back on YOUR side of the field and intercepts — never charges to the far edge
    const vert=G.orient==='vertical';
    let hx=vert?player.x:player.x+56, hy=vert?player.y-56:player.y;   // "home" just ahead of the ship, on your side

    else if(st===2){let bp=null,bd=1e9;for(const p of pickups){const d=dist2(this.x,this.y,p.x,p.y);if(d<bd){bd=d;bp=p;}}if(bp){tx=lerp(hx,bp.x,0.6);ty=lerp(hy,bp.y,0.6);}}   // FORAGER → drift to pickups
    // GUARDIAN (st===1) just holds near the ship (hx,hy)
    if(vert)ty=clamp(ty,player.y-180,H-14); else tx=clamp(tx,14,player.x+180);   // clamp to your side of the screen so it sits back
    const a=Math.atan2(ty-this.y,tx-this.x),d=Math.hypot(tx-this.x,ty-this.y);
    if(d>8){const navSp=2.6;this.x=clamp(this.x+Math.cos(a)*navSp*dt,14,W-14);this.y=clamp(this.y+Math.sin(a)*navSp*dt,14,H-14);}}

  this.fireCd-=dt;
  if(this.fireCd<=0){this.fireCd=Math.max(3,9-L)*(st===2?1.5:1);const dir=G.orient==='vertical'?-Math.PI/2:0,dmg=this.podDmg()*(st===2?0.7:1)*(st===0&&player.podCores.hunter>=2?1.25:1);
    pShots.push({x:this.x,y:this.y,vx:Math.cos(dir)*10,vy:Math.sin(dir)*10,r:3,dmg,color:'#b98bff',pod:true});
    // PRESTIGE DRONE HARDPOINT: fires its mounted weapon + installed core from the drone (every 2nd pod shot so it doesn't out-gun the ship)
    if(player.droneSlot){this.hpTick=(this.hpTick||0)+1;
      if(this.hpTick%2===0){const ds=player.droneSlot,ox=player.x,oy=player.y,ow=player.weapon;
        _mainGunMute=true;
        player.x=this.x;player.y=this.y;player.weapon=ds.w;
        const wd=activeWeaponDef(),nx=Math.cos(dir),ny=Math.sin(dir),times=ds.dbl?2:1;
        for(let b=0;b<times;b++)wd.fire(player,dir,nx,ny,-ny,nx);
        this.fc=(this.fc||0)+1; if(ds.core)fireCore(ds.core,this.x,this.y,dir,nx,ny,this.fc);
        player.x=ox;player.y=oy;player.weapon=ow;_mainGunMute=false;}}
    // (weapon cores otherwise fire only from ship slots — the drone needs the PRESTIGE hardpoint to join in)
    if(L>=3&&st!==2){const best=this.nearest();   // Lv3+ auto-aim tracker (HUNTER/GUARDIAN)
      if(best){const a=Math.atan2(best.y-this.y,best.x-this.x);
        pShots.push({x:this.x,y:this.y,vx:Math.cos(a)*10,vy:Math.sin(a)*10,r:2.8,dmg,color:'#b98bff',pod:true});
        if(L>=4&&st===0)for(const sg of[-0.24,0.24])pShots.push({x:this.x,y:this.y,vx:Math.cos(a+sg)*10,vy:Math.sin(a+sg)*10,r:2.6,dmg:dmg*0.8,color:'#b98bff',pod:true});}}}
  // ---- stance abilities (run whether docked or deployed) ----

  if(L>=5)this.aura(dt);                                                        // damage aura — all stances at Lv5+
  if((st===0||omni)&&(L>=5||player.podCores.hunter>=1))this.warhead(dt);        // HUNTER warheads (a HUNTER CORE unlocks them early)

ForcePod.prototype.fire=function(){};   // firing is unified into ForcePod.update (docked + deployed); kept as a no-op for any legacy callers

/* =====================================================================
   ENEMY BULLETS
   ===================================================================== */
/* Enemy bullets support a `kind` (orb/needle/plasma/wave/homing/laserorb) and optional
   behavior fields (home steer, wave weave). Pattern helpers compose them. */
function eShot(x,y,a,spd,r=4,color='#ff2f8e',kind='orb',extra){
  const bs=D().bspd*(1+G.rank*0.14)*(G.bulletSpeedMul||1)*(1+(G.loop-1)*0.16), s=spd*bs;
  const b={x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r,color,grazed:false,kind,t:0,ba:a,spd:s};
  if(extra)Object.assign(b,extra);
  eShots.push(b);
}
function aimAt(x,y){return Math.atan2(player.y-y,player.x-x);}
function eAimShot(x,y,spd,r,color,kind){eShot(x,y,aimAt(x,y),spd,r,color,kind||'orb');}
function eRing(x,y,n,spd,off=0,color='#ff3b3b',r=4,kind){for(let i=0;i<n;i++)eShot(x,y,off+i/n*TAU,spd,r,color,kind||'orb');}
// aimed n-way spread
function eSpread(x,y,n,spread,spd,r,color,kind){const base=aimAt(x,y);for(let i=0;i<n;i++){const off=(i-(n-1)/2)*spread;eShot(x,y,base+off,spd,r,color,kind||'orb');}}
// horizontal/vertical wall with a gap (relative to the scroll axis)
function eWall(x,y,n,spd,color,r){const vert=G.orient==='vertical';const dir=vert?Math.PI/2:Math.PI;const gap=randi(1,n-1);
  for(let i=0;i<n;i++){if(i===gap)continue;const off=(i-(n-1)/2)*30;eShot(vert?x+off:x,vert?y:y+off,dir,spd,r||4,color||'#ff3b3b','orb');}}
// petalled flower: k arms, each a short aimed line
function eFlower(x,y,arms,perArm,spd,color){const base=aimAt(x,y);for(let a=0;a<arms;a++){const ang=base+a/arms*TAU;for(let j=0;j<perArm;j++)eShot(x,y,ang,spd*(0.6+j*0.28),3.6,color||'#c77dff','orb');}}

/* ---------- telegraphed beam attacks (boss lasers) ----------
   Dashed warning line for `warn` frames, then a lethal beam wall for `active`.
   Fully telegraphed per the boss-design rule: never an un-signaled instant laser. */
const beams=[];
function fireBeam(axis,pos,half,warn,active){beams.push({axis,pos,half,warn,active,t:0,fired:false});}
function updateBeams(dt){
  for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.t+=dt;
    if(!b.fired&&b.t>b.warn){b.fired=true;sfx('laser',1,0.55);shake(0.25);}
    if(b.t>b.warn+b.active){beams.splice(i,1);continue;}
    if(b.t>b.warn&&b.t<b.warn+b.active-10&&player.alive){ // lethal only while still clearly visible (never invisible-but-lethal)
      const d=b.axis==='h'?Math.abs(player.y-b.pos):Math.abs(player.x-b.pos);
      if(d<b.half+player.coreR)player.hit();}}
}
function drawBeams(){
  for(const b of beams){
    CX.save();
    if(b.t<=b.warn){ // warning telegraph
      CX.globalAlpha=(G.frame%8<4)?0.75:0.3;CX.strokeStyle='#ffd166';CX.setLineDash([10,8]);CX.lineWidth=2;
      CX.beginPath();
      if(b.axis==='h'){CX.moveTo(0,b.pos);CX.lineTo(W,b.pos);}else{CX.moveTo(b.pos,0);CX.lineTo(b.pos,H);}
      CX.stroke();CX.setLineDash([]);
      CX.fillStyle='#ffd166';CX.font='bold 12px monospace';CX.textAlign='center';
      if(b.axis==='h'){CX.fillText('⚠',12,b.pos+4);CX.fillText('⚠',W-12,b.pos+4);}
      else{CX.fillText('⚠',b.pos,12);CX.fillText('⚠',b.pos,H-6);}
    }else{ // active beam
      const fade=clamp((b.warn+b.active-b.t)/12,0,1);
      CX.globalCompositeOperation='lighter';CX.globalAlpha=0.85*fade;
      let g;
      if(b.axis==='h'){g=CX.createLinearGradient(0,b.pos-b.half,0,b.pos+b.half);}
      else{g=CX.createLinearGradient(b.pos-b.half,0,b.pos+b.half,0);}
      g.addColorStop(0,'rgba(255,47,142,0)');g.addColorStop(0.5,'#ff5aa8');g.addColorStop(1,'rgba(255,47,142,0)');

// NO build-strength scaling any more — the critic was right, it was a rubber band that silently taxed your upgrades. Enemy HP is a clean STAGE × LOOP × difficulty-tier curve; your power growth is real and felt.
function enemyPow(){return Math.min(1+(G.stage-1)*0.17,4.6)*(1+(G.loop-1)*0.35)*D().ehp;}   // enemy HP by stage/loop/tier only
function dScale(){return Math.min(1+(G.stage-1)*0.09,3.0);}   // WAVE SIZE grows with stage — stage 20 fields ~2× the enemies of stage 10 (per-wave counts were flat before, so deep stages felt no bigger)
function eFire(){return D().fire*Math.min(1+(G.stage-1)*0.04+(G.loop-1)*0.12,2.0);}   // enemies fire faster deeper in (capped) — stage/tier only, no build tax
function makeEnemy(type,x,y,opt={}){
  const e={type,x,y,hp:1,r:12,t:0,dead:false,fireCd:randi(20,60),vx:0,vy:0,score:100,phase:0,flash:0,seen:false,...opt};
  const Dn=ENEMY_DEFS[type];if(Dn)Dn.init(e);
  e.hp=Math.max(1,Math.round(e.hp*1.5*enemyPow()));   // +50% enemy HP (paired with the halved weapon damage — enemies are meatier)
  e.maxhp=e.maxhp||e.hp;return e;
}

/* shield-aware damage: returns true when the enemy should die */
function damageEnemy(e,dmg){
  if(e.enter)return false;   // minibosses are shielded until they finish entering
  if(!e.seen)return false;   // INVULNERABLE until actually on-screen — no more killing enemies before you can even see them
  if(e.shield>0){e.shield-=dmg;e.sflash=3;
    if(e.shield<=0){e.shield=0;ring(e.x,e.y,'#c77dff',4,e.r*2.4,18);floatText(e.x,e.y-e.r,'BREAK','#c77dff',10);sfx('hit',0.7,0.7);}
    return false;}
  e.hp-=dmg;e.flash=3;return e.hp<=0;
}
function drawEnemy(e){
  if(e.flash>0){ // white hit flash
    if(e.spr&&imgReady(IMG[e.spr])){ sprite(e.spr,e.x,e.y,e.scale,faceRot(true),1);
      CX.save();CX.globalCompositeOperation='lighter';CX.globalAlpha=clamp(e.flash/3,0,1);
      sprite(e.spr,e.x,e.y,e.scale,faceRot(true),1);CX.restore();
    } else if(ENEMY_DEFS[e.type].draw){ ENEMY_DEFS[e.type].draw(e); }
    else { drawShipProc(e,'#5a2a3a','#ff2f8e'); }   // fallback so a sprite-load failure never turns an enemy invisible
    return;
  }
  if(e.spr&&imgReady(IMG[e.spr])){
    if(e.glow){CX.globalCompositeOperation='lighter';CX.globalAlpha=0.35+0.25*Math.sin(G.t*0.1+e.phase);
      const g=CX.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r+6);g.addColorStop(0,'#c77dff');g.addColorStop(1,'rgba(0,0,0,0)');
      CX.fillStyle=g;CX.beginPath();CX.arc(e.x,e.y,e.r+6,0,TAU);CX.fill();CX.globalAlpha=1;CX.globalCompositeOperation='source-over';}
    sprite(e.spr,e.x,e.y,e.scale,faceRot(true),1);
  } else if(ENEMY_DEFS[e.type].draw){ ENEMY_DEFS[e.type].draw(e); }
  else { drawShipProc(e,'#5a2a3a','#ff2f8e'); }
  if(e.shieldMax&&e.shield>0){ // energy shield arc, always facing the player
    const a=Math.atan2(player.y-e.y,player.x-e.x);
    CX.strokeStyle=e.sflash>0?'#ffffff':'#c77dff';
    CX.globalAlpha=0.5+0.3*Math.sin(G.t*0.25);CX.lineWidth=2.5;
    CX.beginPath();CX.arc(e.x,e.y,e.r+4,a-0.95,a+0.95);CX.stroke();CX.globalAlpha=1;
  }
  if(e.aiming){ // sniper telegraph — dashed lock line

    CX.beginPath();CX.moveTo(e.x,e.y);CX.lineTo(e.x+Math.cos(e.lockA)*900,e.y+Math.sin(e.lockA)*900);CX.stroke();CX.setLineDash([]);CX.restore();
  }
  if(e.link&&e.link.t>0){ // healer beam
    CX.save();CX.globalCompositeOperation='lighter';CX.globalAlpha=clamp(e.link.t/9,0,1)*0.8;CX.strokeStyle='#4dff88';CX.lineWidth=2;
    CX.beginPath();CX.moveTo(e.x,e.y);CX.lineTo(e.link.x,e.link.y);CX.stroke();CX.restore();CX.globalAlpha=1;
  }
  if(e.enter){ // "still arriving" invuln shimmer
    CX.globalCompositeOperation='lighter';CX.globalAlpha=0.3+0.25*Math.sin(G.t*0.4);CX.strokeStyle='#8fd8ff';CX.lineWidth=2.5;
    CX.beginPath();CX.arc(e.x,e.y,e.r+6,0,TAU);CX.stroke();CX.globalAlpha=1;CX.globalCompositeOperation='source-over';}
  if(e.maxhp>12&&e.type!=='miniboss')drawEnemyHP(e);

const SEQ_BOSS_NAMES=['VANGUARD "AEGIS"','SENTINEL "WARDEN"','HERALD "NEMESIS"'];   // names for the escort-boss(es) that precede the stage's signature boss in a gauntlet

  const col=isLast?(st.col||'#ff2f8e'):['#3df0ff','#ffd166','#c77dff'][bseq%3];
  boss={x:vert?W/2:W+90,y:vert?-90:H/2,r:simple?40:(final?54:48),
    hp,maxhp:hp,t:0,patT:0,pattern:0,enter:true,dead:false,addCd:170,simple,shield:0,_seq:bseq,
    phase:0,phases:3,telegraph:0,fireT:30,desp:false,col,

    name:isLast?((trueFinal?'⟡ TRUE FINAL ⟡ ':'')+st.boss):SEQ_BOSS_NAMES[bseq%SEQ_BOSS_NAMES.length]};

  const decks=[

    [P[0],patBeamSweep,P[4],P[1]],                       // factory: sine curtain + beams
    [P[3],patSummon,P[5],P[2]],                          // city: summons + rockets
    [P[0],P[5],P[4],P[2]],                               // asteroid: rockets + curtain
    [P[3],patSummon,P[1],P[4]],                          // spire: spirals + summon
    [patSummon,P[2],P[5],P[3]],                          // hive: swarms + rockets
    [P[0],patBeamSweep,P[1],P[4]],                       // cryo: beams + spirals

function loopScale(){return 1+(G.loop-1)*0.45;}   // loop 2+ = harder

    if(cur<cap){const n=(ph>=1?2:1)+(G.stage>=14?1:0);for(let i=0;i<n;i++)spawnEdge(bossAddType(),i*32);

// a swirling energy WORMHOLE the boss emerges from — drawn centered on the current transform origin (additive)
function drawWormhole(prog, vis, col){

// ENEMY PROGRESSION — each type is introduced at a stage: level 1 features only the smallest ships; bigger, harder enemies unlock as you advance (~2 new kinds per stage through stage 9).
const ENEMY_TIER={grunt:1,dart:1,squad:1, fighter:2,drone:2, weaver:3,orbiter:3, splitter:4,minelayer:4, sniper:5,shielder:5, elite:6,turret:6, strafer:7,gunship:7, healer:8,carrier:8, wall:9};
const STARTER_MIX=[['grunt',3],['dart',2],['squad',2]];   // tier-1 basics — guarantee early variety even if a stage's themed mix is all higher-tier
function unlockedTypes(){const o=[];for(const k in ENEMY_TIER)if(ENEMY_TIER[k]<=G.stage&&ENEMY_DEFS[k])o.push(k);return o;}
function pickType(mix){
  // draw from EVERYTHING unlocked by the current stage, but weight the stage's themed types higher (theme flavor + growing variety + progression)
  const u=unlockedTypes(); if(!u.length)return 'grunt';
  const mw={}; for(const m of mix)if((ENEMY_TIER[m[0]]||1)<=G.stage)mw[m[0]]=m[1];
  let tot=0; const ws=u.map(tp=>{const w=mw[tp]!==undefined?mw[tp]+0.4:0.6; tot+=w; return w;});
  let r=rand(tot); for(let i=0;i<u.length;i++){r-=ws[i];if(r<=0)return u[i];}
  return u[0];
}
function bossAddType(){   // boss reinforcements: little swarms of small ships early → the full roster (elites/gunships/carriers…) by the endgame
  const u=unlockedTypes(); if(!u.length)return 'grunt';
  const bias=G.stage>=12?1.5:G.stage>=7?0.85:G.stage>=4?0.4:0.12;   // weight toward bigger/newer enemies as the campaign climbs
  let tot=0;const ws=u.map(tp=>{const w=1+(ENEMY_TIER[tp]-1)*bias;tot+=w;return w;});
  let r=rand(tot);for(let i=0;i<u.length;i++){r-=ws[i];if(r<=0)return u[i];}
  return u[u.length-1];
}
/* ---- formations: arrange a group's spawn positions so no two waves look alike ---- */
// each stage favours a different set of formation shapes
const STAGE_FORMS=[
  ['line','vwedge','arc'], ['echelon','column','line'], ['vwedge','pincer','arc'], ['column','echelon','arc'],
  ['awedge','vwedge','line'], ['arc','pincer','column'], ['line','awedge','echelon'], ['pincer','vwedge','arc'],
];
function formationPoints(n,form){
  const vert=G.orient==='vertical', alongMax=vert?W:H, spread=alongMax*0.62, c=alongMax*0.5, pts=[];
  for(let i=0;i<n;i++){const t=n>1?i/(n-1):0.5; let along,depth;
    switch(form){
      case 'line':    along=c-spread/2+spread*t; depth=0; break;
      case 'vwedge':  along=c-spread/2+spread*t; depth=Math.abs(t-0.5)*2*95; break;    // V — center leads
      case 'awedge':  along=c-spread/2+spread*t; depth=(1-Math.abs(t-0.5)*2)*95; break;  // ^ — flanks lead
      case 'column':  along=c+Math.sin(i*1.3)*22; depth=i*40; break;                     // single-file weaving stream
      case 'echelon': along=c-spread/2+spread*t; depth=t*135; break;                     // diagonal staircase
      case 'arc':     along=c-spread/2+spread*t; depth=Math.sin(t*Math.PI)*85; break;     // bowing arc
      case 'pincer':  { const L=i<n/2, tt=L?(i/Math.max(1,n/2)):((i-n/2)/Math.max(1,n/2)); along=L?(c-spread/2-30*tt):(c+spread/2+30*tt); depth=tt*50; } break;
      default:        along=c-spread/2+spread*t; depth=i*22;
    }
    depth+=34;
    if(vert)pts.push({x:clamp(along,20,W-20), y:-depth}); else pts.push({x:W+depth, y:clamp(along,44,H-44)});
  }
  return pts;
}
function spawnFormation(type,n,form){for(const p of formationPoints(n,form)){const e=makeEnemy(type,p.x,p.y);enemies.push(e);}}
const GROUP_N={dart:9,grunt:9,fighter:7,weaver:4,squad:6,turret:4,shielder:4,elite:4,sniper:4,minelayer:4,splitter:6,orbiter:6,gunship:3,strafer:3};
function spawnGroup(type){
  const form=pick(STAGE_FORMS[(G.stage-1)%STAGE_FORMS.length]);
  // heavy solo enemies arrive alone with a small escort formation
  if(type==='carrier'||type==='wall'||type==='healer'){
    const vert=G.orient==='vertical';
    enemies.push(makeEnemy(type, vert?rand(70,W-70):W+40, vert?-40:rand(90,H-90)));
    spawnFormation(type==='healer'?'fighter':'grunt', Math.round(4*dScale()), form); return;
  }
  spawnFormation(type, Math.min(Math.round((GROUP_N[type]||5)*dScale()),22), form);
}
const spawner={waveIdx:0,waveCd:60,bossPending:false,miniOut:false,
  reset(){this.waveIdx=0;this.waveCd=90;this.bossPending=false;this.miniOut=false;this.bossPendingT=0;},
  update(dt){
    if(G.mode!=='play')return;
    if(G.runMode==='bossrush'){ this.waveCd-=dt; if(this.waveCd<=0&&!this.bossPending&&!boss)this.bossPending=true; return; }   // BOSS RUSH: no waves — a short breath, then the stage's boss
    this.waveCd-=dt; if(this.waveCd>0)return;
    this.waveIdx++;
    const final=G.stage>=G.maxStage, lastWave=8+Math.floor(G.stage*0.7)+(final?3:0); // stages GROW as you advance: ~8 waves at stage 1 → 28 by stage 25 (was shrinking mid-game)
    if(this.waveIdx===5){const vert=G.orient==='vertical';enemies.push(makeEnemy('miniboss',vert?W/2:W+40,vert?-40:H/2));this.miniOut=true;this.waveCd=1e9;return;} // mid-stage climax
    if(this.waveIdx===lastWave-3&&this.waveIdx!==5){ // set-piece spike (guard !==5 so it never collides with the wave-5 miniboss on the short early stages)
      G.banner=G.stage>=6?'⚠ ELITE STRIKE':'⚠ ENEMY SURGE';G.subBanner=null;G.bannerT=95;sfx('complete',0.8,0.7);shake(0.2);
      for(let i=0;i<4;i++)spawnEdge(bossAddType(),i*24);
      this.waveCd=210*D().spawn;return;}
    if(this.waveIdx>=lastWave){this.bossPending=true;this.waveCd=1e9;return;}
    this.waveCd=Math.max(100,170-G.stage*4)*D().spawn;   // dense but the cadence no longer collapses — so more waves = genuinely LONGER stages, not just faster ones
    if(this.waveIdx%3===0){ // glowing pod squad — the reliable POWER source every stage
      const form=pick(STAGE_FORMS[(G.stage-1)%STAGE_FORMS.length]);
      for(const p of formationPoints(Math.min(Math.round(6*dScale()),16),form))enemies.push(makeEnemy('squad',p.x,p.y,{phase:rand(TAU)}));}
    else if(this.waveIdx%7===0){ // breather: light popcorn for chain-farming between spikes
      spawnFormation('grunt',Math.round(7*dScale()),pick(['line','arc','vwedge']));}
    else spawnGroup(pickType(curStage().mix));
    if(G.stage>=4&&this.waveIdx%2===0&&this.waveIdx!==5){const nf=1+(G.stage>=10?1:0)+(G.stage>=18?1:0);for(let i=0;i<nf;i++)spawnEdge(pickType(curStage().mix),30+i*22);}   // deeper stages: more flankers ride in with every other wave (1→2→3)
  }};
function spawnEdge(type,delay){const vert=G.orient==='vertical';
  const x=vert?rand(40,W-40):W+30+delay*3,y=vert?-30-delay*3:rand(60,H-60);
  enemies.push(makeEnemy(type,x,y));}
function maybeStartBoss(){
  if(!spawner.bossPending)return;
  if(enemies.length===0){spawner.bossPending=false;spawner.bossPendingT=0;spawnBoss();return;}
  // if stragglers (camping orbiter/gunship/etc.) linger, make them flee so the boss isn't held up
  spawner.bossPendingT=(spawner.bossPendingT||0)+1;
  if(spawner.bossPendingT>150)for(const e of enemies){if(e.type!=='miniboss')e.flee=true;}

let shiftT=0,shiftTo='horizontal',shiftSwapped=false;
const SHIFT_DUR=66; // ~1.1s snappy whip-pan
function startShift(){G.mode='shift';shiftT=0;shiftSwapped=false;beams.length=0;shiftTo=G.orient==='vertical'?'horizontal':'vertical';sfx('complete',1,1);}
function updateShift(dt){
  shiftT+=dt;
  // reorient at the midpoint — the flash mask (rendered at p≈0.5) hides the swap so it reads as one continuous camera whip
  if(shiftT>=SHIFT_DUR*0.5&&!shiftSwapped){
    shiftSwapped=true;
    rayBurst(W/2,H/2,'#dff4ff',20,34,300);   // radiant flare at the moment the world re-orients
    G.orient=shiftTo;G.stage++;
    player.x=W/2;player.y=shiftTo==='vertical'?H*0.78:H/2;if(player.pod)player.pod.attached=true;
    spawner.reset();initStageDecor();music('stage'+(((G.stage-1)%4)+1));   // cycle the 4 stage tracks across all 25 stages
    G.banner='STAGE '+G.stage+': '+curStage().name;G.subBanner=null;G.bannerT=120;
    if(G.runMode==='campaign'&&(isCheckpointStage()||(G.loop>1&&G.stage===1))){saveCheckpoint();G.subBanner='◈ CHECKPOINT SAVED';}   // + LOOP 2 stage 1, so an early Loop-2 death can't "continue" back into Loop 1
    if(G.runMode==='campaign'){const prog=(G.loop-1)*G.maxStage+G.stage;if(prog>G.bestStage){G.bestStage=prog;lsSet('best_stage',prog);}}   // "furthest reached" counts on arrival (Practice offers every stage you've reached, even in runs you quit)   // every 5 stages: snapshot the run so a later death (or closing the game) resumes here (campaign only — rush/practice never touch the save bays)
  }
  if(shiftT>=SHIFT_DUR){G.mode='play';if(G.pauseAfterShift){G.pauseAfterShift=false;G.paused=true;G.pauseSel=0;G.pauseView='menu';}}
}

function useBomb(){
  if(G.bombs<=0||!player.alive) return;
  G.bombs--; player.iframes=Math.max(player.iframes,110); sfx('bomb',1,1); rumble(0.8,0.6,320);
  shake(0.9); G.flash=18; G.flashColor='#bfe9ff'; G.freeze=Math.max(G.freeze,4);
  ring(player.x,player.y,'#bfe9ff',10,Math.max(W,H),34,4);
  // clear enemy bullets -> score sparks
  for(const b of eShots){addScore(2);parts.push({x:b.x,y:b.y,vx:0,vy:0,life:14,max:14,color:'#bfe9ff',size:2.4,g:0});}
  eShots.length=0;
  // damage everything on screen
  for(let j=enemies.length-1;j>=0;j--){if(damageEnemy(enemies[j],40))killEnemy(enemies[j],j,true);}   // noSplit: bomb is a true panic-clear
  if(boss&&!boss.dead){damageBoss(120);}
  floatText(player.x,player.y-24,'BOMB!','#bfe9ff',15);
}

function weaponUpDesc(w,lvl){
  if(w==='pulse')return '+1 shot · dmg '+(2+(lvl-1)*0.6).toFixed(1);
  if(w==='laser')return 'dmg '+(3+lvl)+(lvl>=2?' · +side beam':'');
  if(w==='missile')return Math.min(lvl,5)+' homing missiles';
  if(w==='hex')return 'pierce '+(1+lvl)+(lvl>=3?' · +side bolts':'');
  if(w==='rail')return 'heavy dmg '+(8+lvl*2)+' · pierce';
  if(w==='arc')return 'chains to '+(1+lvl)+' targets';
  if(w==='flak')return (4+lvl)+' pellets · dmg '+(2+lvl*0.6).toFixed(1);   // formulas mirror WEAPON_DEFS fire() and weaponNums() — keep all three in step
  if(w==='scythe')return (lvl>=4?3:lvl>=2?2:1)+' crescents · dmg '+(3+lvl);
  if(w==='tesla')return 'orb arcs to '+(2+Math.ceil(lvl/2))+' · dmg '+(3+lvl*0.9).toFixed(1);
  return '+power';
}
function drawN(pool,n){
  const chosen=[],p=pool.slice();
  for(let k=0;k<n&&p.length;k++){
    let tot=0;for(const c of p)tot+=RARITY[c.rarity].w;
    let r=rand(tot),idx=0;
    for(let i=0;i<p.length;i++){r-=RARITY[p[i].rarity].w;if(r<=0){idx=i;break;}}
    chosen.push(p.splice(idx,1)[0]);
  }
  return chosen;
}

function arcChain(x,y,dmg,jumps,exclude,col){   // ARC COIL / TEMPEST / TESLA / SHOCK — chain lightning drawn as forking Tesla-web bolts
  col=col||'#8fd8ff'; let cur={x,y};const hit=new Set(exclude?[exclude]:[]);

    for(const e of enemies){if(hit.has(e)||!e.seen||e.enter)continue;const d=dist2(cur.x,cur.y,e.x,e.y);if(d<bd){bd=d;best=e;}}   // never chain to unseen/entering enemies — they're invulnerable, and jumping to them silently ate the whole chain

/* ---- TEST FIRE range (Dock: F / pad-X) — your ship fires its real loadout at 3 dummies; a DPS estimate updates live.
   Shots use the real fire() + pDmg(); movement is simplified (straight, boomerang return, light homing), and
   splash / chain / zap extras are approximated — the readout is labelled an estimate. ---- */
const TF={on:false,t:0,total:0,cd:0,dum:[],save:null};
function testFireEnter(){
  TF.on=true;TF.t=0;TF.total=0;TF.cd=0;pShots.length=0;
  TF.save={x:player.x,y:player.y,orient:G.orient,stealAmmo:player.stealAmmo,stealType:player.stealType};   // stolen ammo is set aside so the range shows YOUR loadout and spends none of it

  TF.dum=[0.22,0.5,0.78].map(f=>({x:W*f,y:H*0.24,r:26,dmg:0,hitT:0}));sfx('confirm',0.8,1.2);
}
function testFireExit(){
  TF.on=false;pShots.length=0;if(TF.save){player.x=TF.save.x;player.y=TF.save.y;G.orient=TF.save.orient;player.stealAmmo=TF.save.stealAmmo;player.stealType=TF.save.stealType;}sfx('confirm',0.7,0.9);
}
function testFireUpdate(dt){
  TF.t+=dt; TF.cd-=dt; if(TF.cd<=0){player.fire();TF.cd=player.fireInterval();}
  for(const d of TF.dum)if(d.hitT>0)d.hitT-=dt;
  for(let i=pShots.length-1;i>=0;i--){const s=pShots[i];
    if(s.homing){let best=null,bd=1e9;for(const d of TF.dum){const q=dist2(s.x,s.y,d.x,d.y);if(q<bd){bd=q;best=d;}}
      if(best){const a=Math.atan2(best.y-s.y,best.x-s.x),sp=Math.hypot(s.vx,s.vy)||6;s.vx=lerp(s.vx,Math.cos(a)*sp,0.12);s.vy=lerp(s.vy,Math.sin(a)*sp,0.12);}}
    if(s.boomerang){s.boom=(s.boom||0)+dt;if(s.boom>(s.boomOut||24)){const a=Math.atan2(player.y-s.y,player.x-s.x),sp=Math.hypot(s.vx,s.vy)||9;s.vx=Math.cos(a)*sp;s.vy=Math.sin(a)*sp;
      if(dist2(s.x,s.y,player.x,player.y)<16*16){pShots.splice(i,1);continue;}}}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.life!==undefined){s.life-=dt;if(s.life<=0){pShots.splice(i,1);continue;}}
    let gone=false;
    for(const d of TF.dum){ if(dist2(s.x,s.y,d.x,d.y)<(d.r+(s.r||3))**2){
        s.hitSet=s.hitSet||new Set(); if(s.hitSet.has(d))continue; s.hitSet.add(d);   // one hit per dummy per shot
        let dmg=pDmg(s.dmg||1); if(s.explosive)dmg*=1.5; if(s.arc)dmg+=pDmg(s.dmg||1)*0.75*Math.min(s.arc,2);
        d.dmg+=dmg; TF.total+=dmg; d.hitT=4;
        if(!s.pierce&&!s.boomerang&&!s.laser){pShots.splice(i,1);gone=true;break;} } }
    if(gone)continue;
    if(!s.boomerang&&(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30))pShots.splice(i,1);
  }
}

<!DOCTYPE html>
<!--
  Created by: Brennan Meyer  2026  Santa Clarita, CA  brennanmmeyer@gmail.com
  "I Blame The Wind" - turn-based artillery. Just open this file to play.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>I Blame The Wind</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0b0f14; overflow: hidden;
    font-family: "Trebuchet MS", system-ui, sans-serif; color: #e8eef5;
  }
  #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  /* Canvas is drawn at a fixed logical size and scaled to fit the window. */
  #game {
    background: #10161f; image-rendering: pixelated;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); border-radius: 6px;
    max-width: 100vw; max-height: 100vh;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; background: #0b0f14; z-index: 10;
    transition: opacity .4s; letter-spacing: 2px;
  }
  #loading small { opacity: .5; letter-spacing: 1px; }
  #bar { width: 240px; height: 6px; background: #1c2733; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #4da3ff; transition: width .15s; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1000" height="600"></canvas>
  </div>
  <div id="loading">
    <div>I&nbsp;BLAME&nbsp;THE&nbsp;WIND</div>
    <div id="bar"><div></div></div>
    <small id="loadmsg">loading assets&hellip;</small>
  </div>

  <!-- Inline boot sentinel: if the game scripts never run (e.g. a preview pane
       that only serves this one file), say so clearly instead of hanging. -->
  <script>
    window.addEventListener("error", function (e) {
      var m = document.getElementById("loadmsg");
      if (m) m.textContent = "Error: " + (e.message || "script failed to load");
    }, true);
    setTimeout(function () {
      var booted = window.IBTW && window.IBTW.game && window.IBTW.game.phase !== "loading";
      var m = document.getElementById("loadmsg");
      if (!booted && m) {
        m.innerHTML = window.IBTW
          ? "still loading&hellip; (assets are slow; game will force-start shortly)"
          : "This viewer didn't load the game's script files.<br>" +
            "Open the folder's <b>index.html</b> in your browser instead<br>" +
            "(double-click it, or visit <b>http://localhost:8177</b>).";
      }
    }, 3500);
  </script>

  <!-- Classic scripts (no build step, works via file://). Order = dependency order.
       ?v= busts stale browser caches when the game updates. -->
  <!-- config: pure data -->
  <script src="src/config/settings.js?v=11"></script>
  <script src="src/config/animations.js?v=11"></script>
  <script src="src/config/scenery.js?v=11"></script>
  <script src="src/config/weapons.js?v=11"></script>
  <!-- engine -->
  <script src="src/engine/assets.js?v=11"></script>
  <script src="src/engine/terrain.js?v=11"></script>
  <script src="src/engine/physics.js?v=11"></script>
  <script src="src/engine/camera.js?v=11"></script>
  <script src="src/engine/input.js?v=11"></script>
  <!-- entities -->
  <script src="src/entities/human.js?v=11"></script>
  <script src="src/entities/projectile.js?v=11"></script>
  <!-- systems -->
  <script src="src/systems/damage.js?v=11"></script>
  <script src="src/systems/firing.js?v=11"></script>
  <script src="src/systems/turns.js?v=11"></script>
  <!-- ui + render -->
  <script src="src/ui/hud.js?v=11"></script>
  <script src="src/render/renderer.js?v=11"></script>
  <!-- boot -->
  <script src="src/main.js?v=11"></script>
</body>
</html>
